<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Faridabad Gaming Map - Free Fire Style</title>
    
    <!-- Mapbox GL JS CSS -->
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.css" rel="stylesheet" />

    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #map { width: 100vw; height: 100vh; background: #111; }

        /* गेमिंग स्टाइल सर्च और कंट्रोल बॉक्स */
        .game-ui {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(0, 0, 0, 0.85);
            padding: 12px 20px;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0,255,255,0.3);
            display: flex;
            gap: 12px;
            border: 2px solid #00ffcc;
        }
        .game-ui input {
            padding: 8px 14px;
            width: 220px;
            background: #222;
            color: #fff;
            border: 1px solid #444;
            border-radius: 20px;
            outline: none;
            font-size: 14px;
        }
        .game-ui button {
            padding: 8px 18px;
            background: #00ffcc;
            color: #000;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 0 10px rgba(0,255,255,0.5);
        }
        .game-ui button:hover {
            background: #fff;
        }
    </style>
</head>
<body>

    <!-- गेमिंग यूआई सर्च बार -->
    <div class="game-ui">
        <input type="text" id="destInput" placeholder="डिस्टिनेशन लिखें (जैसे: Neelam Chowk)" value="Neelam Chowk, Faridabad">
        <button onclick="flyToDestination()">मिशन शुरू 🚀</button>
    </div>

    <div id="map"></div>

    <!-- Mapbox GL JS Library -->
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.js"></script>

    <script>
        // यहाँ अपनी फ्री Mapbox Public Token डालनी होगी (Mapbox की साइट पर फ्री अकाउंट बनाकर 2 मिनट में मिलती है)
        mapboxgl.accessToken = 'pk.eyJ1IjoidGFydW4yMjU2MDEiLCJhIjoiY2x5ZXhhbXBsZXRva2VuMDAxIn0.placeholder_token_replace_it'; 
        // नोट: परमानेंट इस्तेमाल के लिए mapbox.com से अपनी फ्री पब्लिक टोकन यहां डाल देना भाई।

        // 1. फरीदाबाद का 3D गेमिंग मैप सेटअप
        const map = new mapboxgl.Map({
            container: 'map',
            style: 'mapbox://styles/mapbox/dark-v11', // एकदम कूल डार्क गेमिंग थीम (या light-v11 भी रख सकता है)
            center: [77.3178, 28.4089], // फरीदाबाद कोऑर्डिनेट्स
            zoom: 15.5,                // नज़दीकी गेमिंग व्यू
            pitch: 60,                 // कैमरे को तिरछा (Tilt) किया ताकि 3D गहराई दिखे
            bearing: -17               // गेम जैसा एंगल
        });

        // 2. मैप लोड होते ही फरीदाबाद की बिल्डिंगों को 3D में ऊपर उठाना (Extrusion Magic)
        map.on('load', () => {
            // इंसर्ट लेयर जो ओपनस्ट्रीट/मैपबॉक्स के डेटा से 3D बिल्डिंग्स खड़ी कर देगी
            const layers = map.getStyle().layers;
            let labelLayerId;
            for (let i = 0; i < layers.length; i++) {
                if (layers[i].type === 'symbol' && layers[i].layout['text-field']) {
                    labelLayerId = layers[i].id;
                    break;
                }
            }

            // 3D बिल्डिंग लेयर जोड़ना
            map.addLayer(
                {
                    'id': '3d-buildings',
                    'source': 'composite',
                    'source-layer': 'building',
                    'filter': ['==', 'extrude', 'true'],
                    'type': 'fill-extrusion',
                    'minzoom': 13,
                    'paint': {
                        'fill-extrusion-color': '#aaa', // बिल्डिंग का रंग
                        // डेटा के हिसाब से बिल्डिंग की असली ऊंचाई (Height) 3D में उठेगी
                        'fill-extrusion-height': [
                            'interpolate',
                            ['linear'],
                            ['zoom'],
                            13,
                            0,
                            15.05,
                            ['get', 'height']
                        ],
                        'fill-extrusion-base': [
                            'interpolate',
                            ['linear'],
                            ['zoom'],
                            13,
                            0,
                            15.05,
                            ['get', 'min_height']
                        ],
                        'fill-extrusion-opacity': 0.85
                    }
                },
                labelLayerId
            );
        });

        // 3. सर्च करके गेम की तरह कैमरा उड़ाकर डेस्टिनेशन पर जाने का फंक्शन
        function flyToDestination() {
            const query = document.getElementById('destInput').value;
            if(!query) return;

            // Mapbox की Geocoding API से जगह ढूंढना
            fetch(`https://api.mapbox.com/geocoding/v5/mapbox.places/${encodeURIComponent(query)}.json?access_token=${mapboxgl.accessToken}&country=in&bbox=77.1,28.2,77.5,28.6`)
                .then(response => response.json())
                .then(data => {
                    if(data.features && data.features.length > 0) {
                        const coords = data.features[0].center;
                        
                        // गेम के कैमरे की तरह एनीमेशन के साथ डेस्टिनेशन पर उड़कर जाना (FlyTo)
                        map.flyTo({
                            center: coords,
                            zoom: 17,
                            pitch: 65,
                            bearing: 30,
                            speed: 1.5, // उड़ने की रफ्तार
                            curve: 1.4,
                            essential: true
                        });

                    } else {
                        alert("भाई, यह जगह फरीदाबाद के आसपास नहीं मिली!");
                    }
                })
                .catch(err => console.log(err));
        }
    </script>
</body>
</html>
