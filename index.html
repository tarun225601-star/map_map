            font-size: 12px;

        .action-btn {

            padding: 6px 10px;
            border-radius: 6px;
        }

        /* Workspace */
        .workspace {

            flex-direction: column;
            background: #121212;

            position: relative;
        }

            flex-direction: column; 
            gap: 16px; 
        }
        .message-container {

            flex-direction: column;
            max-width: 90%;
        }
        .user-container { align-self: flex-end; }
        .bot-container { align-self: flex-start; }

        .message { 
            padding: 12px 16px; 
            border-radius: 12px; 
            font-size: 15px; 
            font-weight: 400; 
            line-height: 1.5;

        }
        .user-msg { background: #27272a; color: #f4f4f5; border-bottom-right-radius: 2px; }
        .bot-msg { background: transparent; color: #e4e4e7; padding-left: 0; border: none; }
        
        .speak-btn {
            background: #27272a;
            border: none;
            color: #a1a1aa;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 6px;
            align-self: flex-start;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .speak-btn:hover { background: #3f3f46; color: #fff; }

        /* Fixed Bottom Input Bar */
        .chat-input-wrapper {
            background: #18181b;
            border-top: 1px solid #27272a;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex-shrink: 0;

            align-items: center;
            background: #27272a;
            border-radius: 24px;
            padding: 8px 14px;
            gap: 10px;

            flex: 1; 
            padding: 4px; 
            border: none; 
            background: transparent; 
            color: #fff; 
            font-size: 15px; 
            outline: none;
        }

            height: 32px;

            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;

</head>

    let audioCtx = null;
    function playKeyClickSound() {
        try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            let bufferSize = audioCtx.sampleRate * 0.012;
            let buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            let output = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;
            let whiteNoise = audioCtx.createBufferSource();
            whiteNoise.buffer = buffer;
            let filter = audioCtx.createBiquadFilter();
            filter.type = 'bandpass'; filter.frequency.value = 1200; filter.Q.value = 1.5;
            let gain = audioCtx.createGain();
            gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.012);
            whiteNoise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
            whiteNoise.start();
        } catch(e) {}
    }

        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            let cleanText = text.replace(/<[^>]*>/g, '').replace(/\*\*/g, '');

            utterance.rate = 1.0;

        container.innerHTML = '';
        list.forEach(pkg => {
            let div = document.createElement('div');
            div.className = 'pkg-item';
            div.innerHTML = `<span class="pkg-name">${pkg}</span> <span class="pkg-price">₹500 खरीदें</span>`;
            div.onclick = () => selectPackage(pkg);
            container.appendChild(div);
        });
    }

    function filterPackages() {
        let query = document.getElementById('pkgSearch').value.toLowerCase();
        let filtered = TOP_PACKAGES.filter(p => p.toLowerCase().includes(query));
        renderPackageList(filtered);
    }

    function openPkgModal() { document.getElementById('pkgModal').style.display = 'block'; }
    function closePkgModal() { document.getElementById('pkgModal').style.display = 'none'; }

    function selectPackage(pkgName) {
        let confirmBuy = confirm(`क्या आप "${pkgName}" का पैकेज ₹500 में खरीदना चाहते हैं?`);
        if(confirmBuy) {
            db.activePackage = pkgName;
            saveData();
            updateUIState();
            closePkgModal();
            appendMessage(`🎉 बधाई हो भाई! तेरा **${pkgName}** का पैकेज (₹500) सफलतापूर्वक एक्टिवेट हो गया है। अब पूछ, इसमें माल कहां से लाएं, लागत कितनी लगेगी और प्रॉफिट कैसे होगा?`, 'bot-msg', true);
        }
    }

    function openSettings() {
        document.getElementById('grokKey').value = db.grokKey;
        document.getElementById('settingsModal').style.display = 'block';
    }
    function closeSettings() { document.getElementById('settingsModal').style.display = 'none'; }

    function saveSettings() {
        let key = document.getElementById('grokKey').value.trim();
        if(key) db.grokKey = key;
        saveData();
        closeSettings();
        alert("सेटिंग सेव हो गई!");
    }

    function saveData() {
        localStorage.setItem('indian_biz_hub_v32', JSON.stringify(db));
    }

    async function fetchBestModel(apiKey) {
        try {
            let res = "https://api.groq.com/openai/v1/models";
            let req = await fetch(res, { headers: { "Authorization": `Bearer ${apiKey}` } });
            let data = await req.json();
            if(req.ok && data.data) {
                let models = data.data.filter(m => (m.id.includes('gpt-oss') || m.id.includes('llama')) && !m.id.includes('guard'));
                if(models.length > 0) db.autoModel = models[0].id;
                saveData();
            }
        } catch(e) {}
    }

    function handleKeyPress(e) { if(e.key === 'Enter') sendMessage(); }

    async function sendMessage() {
        let inputField = document.getElementById('userInput');
        let text = inputField.value.trim();
        if(!text) return;
        appendUserMessage(text);
        inputField.value = "";
        await triggerAIResponse(text);
    }

    function appendUserMessage(text) {
        let chatBox = document.getElementById('chatBox');
        let container = document.createElement('div');
        container.className = 'message-container user-container';
        let div = document.createElement('div');
        div.className = 'message user-msg';
        div.innerText = text;
        container.appendChild(div);
        chatBox.appendChild(container);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function appendMessage(fullText, className, autoSpeak = false) {
        let chatBox = document.getElementById('chatBox');
        let container = document.createElement('div');
        container.className = 'message-container bot-container';
        let div = document.createElement('div');
        div.className = 'message bot-msg';
        div.innerHTML = fullText.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>');
        container.appendChild(div);
        
        let speakBtn = document.createElement('button');
        speakBtn.className = 'speak-btn';
        speakBtn.innerHTML = '🔊 बोलकर सुनो';
        speakBtn.onclick = () => speakText(fullText);
        container.appendChild(speakBtn);

        chatBox.appendChild(container);
        chatBox.scrollTop = chatBox.scrollHeight;

        if (autoSpeak) setTimeout(() => speakText(fullText), 300);
    }

    function typeWriterEffect(fullText, elementId) {
        let chatBox = document.getElementById('chatBox');
        let container = document.createElement('div');
        container.className = 'message-container bot-container';
        let div = document.createElement('div');
        div.className = 'message bot-msg';
        div.id = elementId;
        container.appendChild(div);
        chatBox.appendChild(container);

        let i = 0;
        function typing() {
            if (i < fullText.length) {
                let char = fullText.charAt(i);
                div.innerHTML += char === '\n' ? '<br>' : char;
                if (char !== ' ' && char !== '\n') playKeyClickSound();
                i++;
                chatBox.scrollTop = chatBox.scrollHeight;
                setTimeout(typing, 15);
            } else {
                div.innerHTML = fullText.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>');
                let speakBtn = document.createElement('button');
                speakBtn.className = 'speak-btn';
                speakBtn.innerHTML = '🔊 बोलकर सुनो';
                speakBtn.onclick = () => speakText(fullText);
                container.appendChild(speakBtn);
                chatBox.scrollTop = chatBox.scrollHeight;
                speakText(fullText);
            }
        }
        typing();
    }

    async function triggerAIResponse(query) {
        if(!db.grokKey) {
            appendMessage("⚠️ पहले ⚙️ सेटिंग में अपनी Groq API Key डाल भाई!", 'bot-msg', true);
            openSettings();
            return;
        }

        let systemPromptContent = "";
        let maxTokensVal = 150;

        if (db.activePackage) {
            systemPromptContent = `तू एक सीनियर और प्रोफेशनल बिजनेस ऑपरेटर / कंसलटेंट है। यूजर ने ₹500 देकर यह पैकेज लिया है: '${db.activePackage}'.
            नियम: यूजर को एक असली बिजनेस एक्सपर्ट की तरह पूरी गहराई से, स्टेप-बाय-स्टेप, लीगल, सप्लाई-चेन, मार्केटिंग, मैन्युफैक्चरिंग और प्रॉफिट मार्जिन का पूरा गणित समझा। लंबी और डीटेल चैट लिख ताकि उसे सब कुछ अच्छे से समझ आ जाए। हिंग्लिश में बात कर।`;
            maxTokensVal = 800;
        } else {
            systemPromptContent = `तू एक डायरेक्ट और प्रैक्टिकल बिजनेस पार्टनर है। यूजर अभी फ्री नॉर्मल मोड में है।
            नियम: लंबी रामायण मत लिख। एकदम छोटा, 1 या 2 लाइन का क्रिस्प जवाब दे—सिर्फ अगला एक्शन बता। हिंग्लिश में बात कर।`;
            maxTokensVal = 150;
        }

        let chatBox = document.getElementById('chatBox');
        let loadingContainer = document.createElement('div');
        loadingContainer.className = 'message-container bot-container';
        let loadingDiv = document.createElement('div');
        loadingDiv.className = 'message bot-msg';
        loadingDiv.id = 'loadingMsg';
        loadingDiv.innerText = db.activePackage ? "प्रोफेशनल ऑपरेटर गाइड तैयार हो रही है..." : "सोच रहा हूँ...";
        loadingContainer.appendChild(loadingDiv);
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            let res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: { "Authorization": `Bearer ${db.grokKey}`, "Content-Type": "application/json" },
                body: JSON.stringify({
                    model: db.autoModel || "openai/gpt-oss-120b",
                    messages: [
                        { role: "system", content: systemPromptContent },
                        { role: "user", content: query }
                    ],
                    temperature: 0.7,
                    max_tokens: maxTokensVal
                })
            });
            
            let data = await res.json();
            if(document.getElementById('loadingMsg')) chatBox.removeChild(loadingContainer);

            if(res.ok && data.choices) {
                let reply = data.choices[0].message.content.trim();
                typeWriterEffect(reply, 'msg_' + Date.now());
            } else {
                appendMessage("⚠️ API एरर आ गया भाई.", 'bot-msg', true);
            }
        } catch(e) {
            if(document.getElementById('loadingMsg')) chatBox.removeChild(loadingContainer);
            appendMessage("⚠️ नेटवर्क दिक्कत है भाई.", 'bot-msg', true);
        }
    }
</script>
