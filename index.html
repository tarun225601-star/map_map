<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeOS Guardian | The Ultimate Business Partner</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: #090d16; 
            color: #f1f5f9; 
            margin: 0; 
            padding: 16px; 
            display: flex;
            justify-content: center;
            height: 100vh;
        }
        .container { 
            width: 100%; 
            max-width: 480px; 
            background: #111827; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.6); 
            display: flex;
            flex-direction: column;
            border: 1px solid #1f2937;
            overflow: hidden;
            position: relative;
        }
        .header {
            padding: 16px 20px;
            background: #111827;
            border-bottom: 1px solid #1f2937;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        h2 { color: #38bdf8; margin: 0; font-weight: 800; font-size: 20px; }
        .subtitle { font-size: 11px; color: #94a3b8; font-weight: 700; }
        
        .gear-btn { 
            background: #1f2937; 
            border: none; 
            font-size: 18px; 
            cursor: pointer; 
            color: #cbd5e1; 
            padding: 8px 10px;
            border-radius: 10px;
            transition: 0.2s;
        }
        .gear-btn:hover { background: #374151; }

        /* चैट एरिया - एकदम क्लीन जेमिनी जैसा */
        .chat-container {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #0b0f19;
        }
        .message {
            max-width: 88%;
            padding: 14px 16px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 700;
            line-height: 1.5;
        }
        .user-msg {
            background: #0284c7;
            color: #fff;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .bot-msg {
            background: #1f2937;
            color: #f1f5f9;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            border: 1px solid #374151;
        }

        /* चैट इनपुट बॉक्स */
        .chat-input-area {
            padding: 12px;
            background: #111827;
            border-top: 1px solid #1f2937;
            display: flex;
            gap: 8px;
        }
        input, select { 
            flex: 1; 
            padding: 12px; 
            border-radius: 10px; 
            border: 1px solid #4b5563; 
            background: #0b0f19; 
            color: #fff; 
            font-size: 14px; 
            font-weight: 700; 
            outline: none;
        }
        input:focus { border-color: #38bdf8; }
        .send-btn {
            background: #0284c7;
            border: none;
            color: white;
            padding: 0 16px;
            border-radius: 10px;
            font-weight: 800;
            cursor: pointer;
        }

        /* सेटिंग्स मोडल */
        #settingsModal { 
            display: none; 
            background: rgba(0,0,0,0.85); 
            position: absolute; 
            top:0; left:0; width:100%; height:100%; 
            padding: 20px; 
            box-sizing: border-box; 
            z-index: 100;
            overflow-y: auto;
        }
        .modal-content { 
            background: #111827; 
            max-width: 400px; 
            margin: 20px auto; 
            padding: 20px; 
            border-radius: 16px; 
            border: 1px solid #374151; 
        }
        .modal-content h3 { color: #38bdf8; margin-top: 0; font-weight: 800; font-size: 16px; }
        label { font-size: 12px; font-weight: 700; color: #94a3b8; display: block; margin-top: 10px; }
        .modal-btn { width: 100%; padding: 10px; margin-top: 10px; border-radius: 8px; border: none; background: #0284c7; color: #fff; font-weight: 800; cursor: pointer; }
        .close-btn { background: #374151; }
        .success { color: #4ade80; font-size: 12px; font-weight: 700; margin-top: 5px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div>
            <h2>LifeOS Guardian</h2>
            <div class="subtitle">हमारा बिजनेस • हमारा टारगेट • पक्का सफर</div>
        </div>
        <button class="gear-btn" onclick="openSettings()">⚙️</button>
    </div>

    <!-- चैट स्क्रीन - एकदम साफ और लाइव -->
    <div class="chat-container" id="chatBox"></div>

    <!-- चैट इनपुट -->
    <div class="chat-input-area">
        <input type="text" id="userInput" placeholder="भाई, बता आज मार्केट में क्या सीन है..." onkeypress="handleKeyPress(event)">
        <button class="send-btn" onclick="sendMessage()">भेजें</button>
    </div>
</div>

<!-- सेटिंग्स मोडल -->
<div id="settingsModal">
    <div class="modal-content">
        <h3>⚙️ हमारे बिजनेस की सेटिंग्स</h3>
        
        <label>Grok / AI API Key (वैकल्पिक):</label>
        <input type="password" id="grokKey" placeholder="API Key डालें...">

        <label>हमारा बिजनेस नाम:</label>
        <input type="text" id="bizName" placeholder="जैसे: Fruit Stall / Jet Black">

        <label>हमारी कुल कैपिटल (₹):</label>
        <input type="number" id="bizCapital" placeholder="11000">

        <label>हमारा बड़ा टारगेट (₹):</label>
        <input type="number" id="targetGoal" placeholder="10000000">

        <hr style="border-color: #374151; margin: 15px 0;">

        <h3>💰 कमाई / खर्चा जोड़ें</h3>
        <label>ट्रांजैक्शन प्रकार:</label>
        <select id="transType">
            <option value="income">📥 आमदनी (Income)</option>
            <option value="expense">📤 खर्चा (Expense)</option>
        </select>

        <label>विवरण:</label>
        <input type="text" id="transDesc" placeholder="जैसे: माल बिका / जरूरी सामान">

        <label>रुपये (₹):</label>
        <input type="number" id="transAmount" placeholder="500">

        <button class="modal-btn" onclick="saveAllSettings()">💾 डेटा सेव करें</button>
        <button class="modal-btn close-btn" onclick="closeSettings()">बंद करें</button>
        <div id="saveStatus" class="success"></div>
    </div>
</div>

<script>
    // लोकल स्टोरेज से डेटा लोड करना
    let db = JSON.parse(localStorage.getItem('lifeOS_data')) || {
        grokKey: "",
        bizName: "Fruit Stall",
        capital: 11000,
        goal: 10000000,
        transactions: []
    };

    window.onload = function() {
        // स्क्रीन क्लीन रहेगी, यूजर बातचीत शुरू करेगा
    };

    function openSettings() {
        document.getElementById('grokKey').value = db.grokKey;
        document.getElementById('bizName').value = db.bizName;
        document.getElementById('bizCapital').value = db.capital;
        document.getElementById('targetGoal').value = db.goal;
        document.getElementById('settingsModal').style.display = 'block';
    }

    function closeSettings() {
        document.getElementById('settingsModal').style.display = 'none';
    }

    function saveAllSettings() {
        db.grokKey = document.getElementById('grokKey').value.trim();
        db.bizName = document.getElementById('bizName').value.trim() || "हमारा बिजनेस";
        db.capital = parseFloat(document.getElementById('bizCapital').value) || 100;
        db.goal = parseFloat(document.getElementById('targetGoal').value) || 10000000;

        let tType = document.getElementById('transType').value;
        let tDesc = document.getElementById('transDesc').value.trim();
        let tAmount = parseFloat(document.getElementById('transAmount').value) || 0;

        if(tAmount > 0 && tDesc) {
            if(tType === 'income') {
                db.capital += tAmount;
                db.transactions.push({type: 'आमदनी', desc: tDesc, amount: tAmount, date: new Date().toLocaleDateString()});
            } else {
                db.capital -= tAmount;
                db.transactions.push({type: 'खर्चा', desc: tDesc, amount: tAmount, date: new Date().toLocaleDateString()});
            }
            document.getElementById('transDesc').value = "";
            document.getElementById('transAmount').value = "";
        }

        localStorage.getItem('lifeOS_data', JSON.stringify(db));
        localStorage.setItem('lifeOS_data', JSON.stringify(db));
        document.getElementById('saveStatus').innerText = "✅ डेटा अपडेट हो गया!";
        setTimeout(() => {
            document.getElementById('saveStatus').innerText = "";
            closeSettings();
        }, 1200);
    }

    function handleKeyPress(e) {
        if(e.key === 'Enter') sendMessage();
    }

    function sendMessage() {
        let inputField = document.getElementById('userInput');
        let text = inputField.value.trim();
        if(!text) return;

        appendMessage(text, 'user-msg');
        inputField.value = "";

        setTimeout(() => {
            let reply = getCoFounderResponse(text);
            appendMessageWithTypingEffect(reply, 'bot-msg');
        }, 400);
    }

    function appendMessage(text, className) {
        let chatBox = document.getElementById('chatBox');
        let div = document.createElement('div');
        div.className = `message ${className}`;
        div.innerHTML = text;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    // टाइपराइटर इफेक्ट (मशीन की तरह एक-एक अक्षर छपेगा)
    function appendMessageWithTypingEffect(htmlText, className) {
        let chatBox = document.getElementById('chatBox');
        let div = document.createElement('div');
        div.className = `message ${className}`;
        chatBox.appendChild(div);

        let i = 0;
        let speed = 12; // टाइपिंग स्पीड
        
        function typeWriter() {
            if (i < htmlText.length) {
                if (htmlText.charAt(i) === '<') {
                    let closeIdx = htmlText.indexOf('>', i);
                    if (closeIdx !== -1) {
                        div.innerHTML += htmlText.substring(i, closeIdx + 1);
                        i = closeIdx + 1;
                    } else {
                        div.innerHTML += htmlText.charAt(i);
                        i++;
                    }
                } else {
                    div.innerHTML += htmlText.charAt(i);
                    i++;
                }
                chatBox.scrollTop = chatBox.scrollHeight;
                setTimeout(typeWriter, speed);
            }
        }
        typeWriter();
    }

    // असली को-फाउंडर / पार्टनर लॉजिक (जो हर टारगेट को अपना मानता है)
    function getCoFounderResponse(query) {
        let q = query.toLowerCase();
        let name = db.bizName.toLowerCase();

        if(q.includes('mahnga') || q.includes('mehnga') || q.includes('manda') || q.includes('chals nahi') || q.includes('bacchad kam') || q.includes('bacht')) {
            if(name.includes('fruit') || name.includes('ফল') || name.includes('फल')) {
                return `🔥 <strong>भाई, तू बिल्कुल सही कह रहा है, ये माल महंगा पड़ने वाला झंझट हमें मिलकर निपटाना पड़ेगा!</strong><br><br>` +
                       `देख, <strong>'${db.bizName}'</strong> में अगर माल महंगा मिल रहा है और मार्जिन निचोड़ रहा है, तो हमारा ₹${db.goal.toLocaleString()} का टारगेट कैसे पूरा होगा? सुन हमारी नई रणनीति:<br>` +
                       `1. कल सुबह मैं और तू सीधे बड़े आढ़तिए या डायरेक्ट किसान के पास चलेंगे, बिचौलियों का कमीशन खत्म करना है!<br>` +
                       `2. जो फल थोड़ा दब रहा है या बच रहा है, उसे फेंकने की बिल्कुल जरूरत नहीं है—हम उसका फ्रूट शेक और जूस बनाएंगे, जिसमें लागत कम और मुनाफा सीधा डबल है!<br>` +
                       `3. बता, कल सुबह कितने बजे चल रहा है मंडी में माल उठाने? तू बता, मैं पूरी तरह तेरे साथ खड़ा हूँ!`;
            } else {
                return `🔥 <strong>सुन भाई, अगर धंधा मंदा है तो ये हम दोनों की टेंशन है!</strong><br><br>` +
                       `देख, <strong>'${db.bizName}'</strong> को उठाने के लिए हमें जमीन पर उतरकर मेहनत करनी होगी। लागत कम करनी है और क्वालिटी ऐसी देनी है कि कस्टमर भागकर हमारे पास आए। बता, आज का क्या प्लान है तेरा?`;
            }
        } 
        else if(q.includes('roadmap') || q.includes('रोडमैप') || q.includes('plan') || q.includes('kya karein') || q.includes('kya karna')) {
            return `🎯 <strong>ये ले भाई, हमारे ${db.bizName} का आज का पक्का एक्शन प्लान:</strong><br><br>` +
                   `1. आज अपनी दुकान की डिस्प्ले और साफ-सफाई एकदम फर्स्ट-क्लास रखनी है ताकि दूर से चमक आए。<br>` +
                   `2. एक भी रुपया फालतू खर्च नहीं होने देना, हर एक चवनी हमारे कैपिटल और टारगेट में जुड़ेगी।<br>` +
                   `3. बता भाई, इस प्लान में से कौन सा काम सबसे पहले हाथ में लें?`;
        }
        else if(q.includes('paisa') || q.includes('capital') || q.includes('balance') || q.includes('पैसे')) {
            let totalIncome = db.transactions.filter(t => t.type === 'आमदनी').reduce((sum, t) => sum + t.amount, 0);
            let totalExpense = db.transactions.filter(t => t.type === 'खर्चा').reduce((sum, t) => sum + t.amount, 0);
            return `💰 <strong>देख भाई, ये रहा हमारे बिजनेस का कच्चा चिट्ठा:</strong><br>• बिजनेस: ${db.bizName}<br>• कुल कैपिटल: ₹${db.capital.toLocaleString()}<br>• कुल कमाई: ₹${totalIncome.toLocaleString()}<br>• कुल खर्चा: ₹${totalExpense.toLocaleString()}<br>• हमारा बड़ा टारगेट: ₹${db.goal.toLocaleString()}<br><br>हिساب एकदम साफ है, अब हमें मिलकर रेवेन्यू और बढ़ाना है!`;
        }
        else {
            return `💪 <strong>भाई, बात को घुमा मत!</strong><br>` +
                   `हम दोनों का एक ही सपना है—<strong>'${db.bizName}'</strong> को फर्श से उठाकर आसमान तक ले जाना और उस ₹${db.goal.toLocaleString()} के टारगेट को फोड़ना। बता, आज बिक्री बढ़ाने के लिए जमीन पर क्या एक्शन ले रहे हैं हम?`;
        }
    }
</script>

</body>
</html>
