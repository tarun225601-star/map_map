<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indian Business Hub | AI Co-Founder</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: #060913; 
            color: #f1f5f9; 
            margin: 0; 
            padding: 8px; 
            display: flex;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        .container { 
            width: 100%; 
            max-width: 480px; 
            background: #0f172a; 
            border-radius: 18px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.8); 
            display: flex;
            flex-direction: column;
            border: 1px solid #1e293b;
            overflow: hidden;
            position: relative;
            height: 100%;
        }
        .header {
            padding: 12px 16px;
            background: #0f172a;
            border-bottom: 1px solid #1e293b;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        h2 { color: #38bdf8; margin: 0; font-weight: 800; font-size: 15px; }
        .subtitle { font-size: 10px; color: #94a3b8; font-weight: 700; }
        
        .header-btns { display: flex; gap: 6px; align-items: center; }
        .token-badge {
            background: rgba(234, 179, 8, 0.15);
            border: 1px solid #eab308;
            color: #facc15;
            padding: 4px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }
        .action-btn { 
            background: #1e293b; 
            border: none; 
            font-size: 13px; 
            cursor: pointer; 
            color: #cbd5e1; 
            padding: 6px 8px;
            border-radius: 8px;
        }

        /* Clean Navigation Tabs */
        .nav-tabs {
            display: flex;
            background: #090d16;
            border-bottom: 1px solid #1e293b;
            flex-shrink: 0;
        }
        .tab-btn {
            flex: 1;
            padding: 10px;
            background: none;
            border: none;
            color: #64748b;
            font-weight: 800;
            font-size: 11px;
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
        }
        .tab-btn.active {
            color: #38bdf8;
            border-bottom: 2px solid #38bdf8;
            background: rgba(56, 189, 248, 0.05);
        }

        /* Content Panes */
        .pane {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: none;
            background: #0b0f19;
            flex-direction: column;
        }
        .pane.active { display: flex; }

        /* Package Cards */
        .biz-card {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 12px;
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin-bottom: 10px;
        }
        .biz-title { font-size: 12px; font-weight: 800; color: #f8fafc; display: flex; justify-content: space-between; align-items: center; }
        .biz-meta { font-size: 10px; color: #94a3b8; font-weight: 700; display: flex; gap: 10px; }
        .biz-desc { font-size: 10px; color: #cbd5e1; line-height: 1.3; font-weight: 500; }
        .unlock-btn {
            background: #0284c7;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 6px;
            font-weight: 800;
            font-size: 10px;
            cursor: pointer;
            align-self: flex-start;
        }
        .unlock-btn.unlocked { background: #16a34a; }

        /* Chat UI Clean Box (No Clutter, Proper Spacing) */
        .chat-box { 
            flex: 1; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
            padding-bottom: 10px; 
        }
        .message { max-width: 88%; padding: 10px 12px; border-radius: 10px; font-size: 12px; font-weight: 700; line-height: 1.4; word-break: break-word; }
        .user-msg { background: #0284c7; color: #fff; align-self: flex-end; border-bottom-right-radius: 2px; }
        .bot-msg { background: #1f2937; color: #f1f5f9; align-self: flex-start; border-bottom-left-radius: 2px; border: 1px solid #374151; }

        /* Raised Input Area to prevent overlapping */
        .chat-input-area {
            padding: 10px 12px;
            background: #0f172a;
            border-top: 1px solid #1e293b;
            display: flex;
            gap: 8px;
            flex-shrink: 0;
            margin-bottom: 4px;
        }
        input { 
            flex: 1; 
            padding: 10px; 
            border-radius: 8px; 
            border: 1px solid #4b5563; 
            background: #0b0f19; 
            color: #fff; 
            font-size: 12px; 
            font-weight: 700; 
            outline: none;
        }
        .send-btn { background: #0284c7; border: none; color: white; padding: 0 12px; border-radius: 8px; font-weight: 800; cursor: pointer; font-size: 12px; }

        /* Modal */
        .modal { 
            display: none; background: rgba(0,0,0,0.85); position: absolute; top:0; left:0; width:100%; height:100%; 
            padding: 15px; box-sizing: border-box; z-index: 100; overflow-y: auto; 
        }
        .modal-content { background: #111827; max-width: 380px; margin: 30px auto; padding: 16px; border-radius: 14px; border: 1px solid #374151; }
        .modal-content h3 { color: #38bdf8; margin-top: 0; font-weight: 800; font-size: 15px; }
        label { font-size: 11px; font-weight: 700; color: #94a3b8; display: block; margin-top: 8px; }
        .modal-btn { width: 100%; padding: 9px; margin-top: 12px; border-radius: 6px; border: none; background: #0284c7; color: #fff; font-weight: 800; cursor: pointer; font-size: 12px; }
        .close-btn { background: #374151; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div>
            <h2>🇮🇳 Indian Business Hub</h2>
            <div class="subtitle">AI बिजनेस को-फाउंडर</div>
        </div>
        <div class="header-btns">
            <div class="token-badge" onclick="addTokens()" title="टोकन जोड़ों">🪙 <span id="tokenCount">15</span> Tokens</div>
            <button class="action-btn" onclick="openSettings()" title="सेटिंग्स">⚙️</button>
        </div>
    </div>

    <!-- Clean Navigation Tabs -->
    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('packages')">📦 बिजनेस पैकेज डैशबोर्ड</button>
        <button class="tab-btn" onclick="switchTab('chat')">💬 चैट को-फाउंडर</button>
    </div>

    <!-- Pane 1: Clean Package Dashboard -->
    <div id="pane-packages" class="pane active">
        <div style="font-size: 11px; color: #94a3b8; font-weight: 700; margin-bottom: 8px;">कोई भी बिजनेस सेलेक्ट करें, सीधे चैट में प्लान शुरू होगा:</div>
        <div id="fullPackageDashboard" style="display: flex; flex-direction: column; gap: 8px;"></div>
    </div>

    <!-- Pane 2: Ultra Clean Chat Box (No banners, strictly bound to active business) -->
    <div id="pane-chat" class="pane">
        <div class="chat-box" id="chatBox"></div>
        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="भाई, धंधे की बात कर..." onkeypress="handleKeyPress(event)">
            <button class="send-btn" onclick="sendMessage()">भेजें</button>
        </div>
    </div>
</div>

<!-- Settings Modal -->
<div id="settingsModal" class="modal">
    <div class="modal-content">
        <h3>⚙️ सेटिंग्स</h3>
        
        <label>Groq API Key:</label>
        <input type="password" id="grokKey" placeholder="अपनी API key यहाँ डालें...">

        <div id="modelStatus" style="font-size: 11px; color: #38bdf8; margin-top: 8px; font-weight: 700;"></div>

        <button class="modal-btn" onclick="saveSettings()">💾 सेव करें & मॉडल ऑटो-फेच करें</button>
        <button class="modal-btn close-btn" onclick="closeSettings()">बंद करें</button>
    </div>
</div>

<script>
    const categories = ['फूड & रिटेल', 'ऑटोमोटिव केयर', 'डीप क्लीनिंग', 'मोबाइल ऐप', 'ई-कॉमर्स', 'केमिकल्स & मैन्युफैक्चरिंग', 'एग्री-टेक', 'डिजिटल एजेंसी'];
    const bizTemplates = [
        {name: "फ्रूट स्टॉल एक्सप्रेस", cap: 11000, target: 10000000, cat: "फूड & रिटेल", desc: "फास्ट मूविंग फ्रूट्स और कट-फ्रूट सैलेड से डेली कैश फ्लो।"},
        {name: "जेट Black पॉलिश फॉर्मूला", cap: 15000, target: 10000000, cat: "केमिकल्स & मैन्युफैक्चरिंग", desc: "गाड़ियों के टायर और डैशबोर्ड पॉलिश की खुद की मैन्युफैक्चरिंग।"},
        {name: "Elight डीप क्लीनिंग वेंचर", cap: 20000, target: 10000000, cat: "डीप क्लीनिंग", desc: "सोफा और घर की प्रोफेशनल डीप क्लीनिंग सर्विस।"},
        {name: "CyberGuard Pro ऐप", cap: 10000, target: 10000000, cat: "मोबाइल ऐप", desc: "फ्रॉड लिंक और मैसेज डिटेक्ट करने वाला मोबाइल सिक्योरिटी ऐप।"}
    ];

    let allBusinesses = [...bizTemplates];
    for(let i = 5; i <= 50; i++) {
        let cat = categories[i % categories.length];
        allBusinesses.push({
            name: `स्मार्ट वेंचर मॉडल #${i}`,
            cap: 10000 + (i * 400),
            target: 10000000,
            cat: cat,
            desc: `${cat} सेक्टर का हाई-प्रॉफिटेबल ऑटोमेटेड बिजनेस ब्लूप्रिंट।`
        });
    }

    let db = JSON.parse(localStorage.getItem('indian_biz_hub_data')) || {
        grokKey: "",
        tokens: 15,
        unlocked: [0, 1],
        activeBizIndex: 0,
        autoModel: "openai/gpt-oss-120b"
    };

    window.onload = function() {
        document.getElementById('tokenCount').innerText = db.tokens;
        renderDashboard();
        let activeB = allBusinesses[db.activeBizIndex];
        appendMessage(`💪 राम-राम भाई! हमने '${activeB.name}' (कैपिटल: ₹${activeB.cap.toLocaleString()}) सेट कर लिया है। बता, इस धंधे को आगे कैसे बढ़ाना है?`, 'bot-msg');
        
        if(db.grokKey) {
            fetchBestModel(db.grokKey);
        }
    };

    function switchTab(tab) {
        document.querySelectorAll('.pane').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        if(tab === 'packages') {
            document.getElementById('pane-packages').classList.add('active');
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
        } else {
            document.getElementById('pane-chat').classList.add('active');
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
        }
    }

    function renderDashboard() {
        let fullDash = document.getElementById('fullPackageDashboard');
        fullDash.innerHTML = '';

        allBusinesses.forEach((b, idx) => {
            let isUnlocked = db.unlocked.includes(idx);
            let isActive = db.activeBizIndex === idx;

            let cardHTML = `
                <div class="biz-card" style="border-color: ${isActive ? '#38bdf8' : '#1f2937'}">
                    <div class="biz-title">
                        <span>${idx + 1}. ${b.name} ${isActive ? '⭐ [एक्टिव]' : ''}</span>
                        <span style="font-size: 9px; color: #38bdf8; background: rgba(56,189,248,0.1); padding: 2px 5px; border-radius: 4px;">${b.cat}</span>
                    </div>
                    <div class="biz-meta">
                        <span>कैपिटल: ₹${b.cap.toLocaleString()}</span>
                        <span>टार्गेट: ₹1 Crore</span>
                    </div>
                    <div class="biz-desc">${b.desc}</div>
                    <button class="unlock-btn ${isUnlocked ? 'unlocked' : ''}" onclick="selectAndSwitchToChat(${idx})">
                        ${isUnlocked ? (isActive ? '🟢 चैट में एक्टिव है' : '👉 सेलेक्ट करके चैट पर जाएं') : '🪙 1 टोकन देकर खरीदें'}
                    </button>
                </div>
            `;
            fullDash.innerHTML += cardHTML;
        });
    }

    function addTokens() {
        db.tokens += 5;
        localStorage.setItem('indian_biz_hub_data', JSON.stringify(db));
        document.getElementById('tokenCount').innerText = db.tokens;
        alert("🎉 5 फ्री टोकन्स आपके वॉलेट में जुड़ गए!");
    }

    function selectAndSwitchToChat(idx) {
        let b = allBusinesses[idx];
        if(!db.unlocked.includes(idx)) {
            if(db.tokens >= 1) {
                db.tokens -= 1;
                db.unlocked.push(idx);
            } else {
                alert("❌ टोकन खत्म हो गए हैं! ऊपर 🪙 टोकन बटन से फ्री टोकन लें।");
                return;
            }
        }
        
        db.activeBizIndex = idx;
        localStorage.setItem('indian_biz_hub_data', JSON.stringify(db));
        renderDashboard();

        switchTab('chat');
        appendMessage(`भाई, हमने '${b.name}' (कैपिटल: ₹${b.cap.toLocaleString()}) पैकेज चुन लिया है। अब इसी का मास्टर प्लान बना!`, 'user-msg');
        triggerAIResponse(`भाई, हमने सिर्फ '${b.name}' (कैपिटल: ₹${b.cap.toLocaleString()}) बिजनेस सेलेक्ट किया है। इसके ₹1 करोड़ के टारगेट को पाने के लिए पहले हफ्ते की फुल-प्रूफ स्ट्रैटेजी बता।`);
    }

    function openSettings() {
        document.getElementById('grokKey').value = db.grokKey;
        document.getElementById('modelStatus').innerText = db.autoModel ? `एक्टिव मॉडल: ${db.autoModel}` : "मॉडल सेट हो रहा है...";
        document.getElementById('settingsModal').style.display = 'block';
    }
    
    function closeSettings() { document.getElementById('settingsModal').style.display = 'none'; }

    async function saveSettings() {
        let key = document.getElementById('grokKey').value.trim();
        if(!key) {
            alert("⚠️ कृपया अपनी Groq API Key दर्ज करें!");
            return;
        }
        db.grokKey = key;
        document.getElementById('modelStatus').innerText = "🔄 लेटेस्ट एक्टिव चैट मॉडल तलाश कर रहे हैं...";
        
        let success = await fetchBestModel(key);
        if(success) {
            localStorage.setItem('indian_biz_hub_data', JSON.stringify(db));
            alert("✅ API Key सेव हो गई और नया मॉडल लॉक हो गया!");
            closeSettings();
        } else {
            alert("❌ API Key गलत है या नेटवर्क में दिक्कत है।");
        }
    }

    // ऑटो-फेच और स्मार्ट फ़िल्टर
    async function fetchBestModel(apiKey) {
        try {
            let res = await fetch("https://api.groq.com/openai/v1/models", {
                method: "GET",
                headers: { "Authorization": `Bearer ${apiKey}` }
            });
            let data = await res.json();
            if(res.ok && data.data && data.data.length > 0) {
                let chatModels = data.data.filter(m => 
                    m.active !== false &&
                    (m.id.includes('gpt-oss') || m.id.includes('qwen') || m.id.includes('llama')) &&
                    !m.id.includes('guard') && !m.id.includes('embed') && !m.id.includes('whisper')
                );

                if(chatModels.length > 0) {
                    let selected = chatModels.find(m => m.id.includes('gpt-oss-120b')) || 
                                   chatModels.find(m => m.id.includes('gpt-oss-20b')) || 
                                   chatModels[0];
                    db.autoModel = selected.id;
                } else {
                    db.autoModel = "openai/gpt-oss-120b";
                }
                localStorage.setItem('indian_biz_hub_data', JSON.stringify(db));
                return true;
            }
        } catch(e) {
            console.error(e);
        }
        if(!db.autoModel) db.autoModel = "openai/gpt-oss-120b";
        return true;
    }

    function handleKeyPress(e) { if(e.key === 'Enter') sendMessage(); }

    async function sendMessage() {
        let inputField = document.getElementById('userInput');
        let text = inputField.value.trim();
        if(!text) return;
        appendMessage(text, 'user-msg');
        inputField.value = "";
        await triggerAIResponse(text);
    }

    function appendMessage(text, className) {
        let chatBox = document.getElementById('chatBox');
        let div = document.createElement('div');
        div.className = `message ${className}`;
        div.innerHTML = text;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function triggerAIResponse(query) {
        if(!db.grokKey) {
            appendMessage("⚠️ भाई, पहले ऊपर ⚙️ सेटिंग आइकन पर क्लिक करके अपनी Groq API Key डाल!", 'bot-msg');
            openSettings();
            return;
        }

        let b = allBusinesses[db.activeBizIndex];
        let chatBox = document.getElementById('chatBox');
        let loadingDiv = document.createElement('div');
        loadingDiv.className = 'message bot-msg';
        loadingDiv.id = 'loadingMsg';
        loadingDiv.innerText = "उस्ताद सोच रहा है...";
        chatBox.appendChild(loadingDiv);
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            let res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${db.grokKey}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    model: db.autoModel || "openai/gpt-oss-120b",
                    messages: [
                        { role: "system", content: `तू 'Indian Business Hub' ऐप का खूंखार और शार्प बिजनेस को-फाउंडर है। यूजर ने केवल और केवल यह एक्टिव बिजनेस चुना है: '${b.name}', कैपिटल: ₹${b.cap} और टारगेट: ₹1 Crore. तुझे सिर्फ इसी बिजनेस के बारे में सटीक, सॉलिड और टू-द-पॉइंट सलाह देनी है। किसी दूसरे बिजनेस का जिक्र मत कर। हमेशा 'हम' बोलकर हिंग्लिश में बात कर।` },
                        { role: "user", content: query }
                    ],
                    temperature: 0.7
                })
            });
            
            let data = await res.json();
            if(document.getElementById('loadingMsg')) chatBox.removeChild(document.getElementById('loadingMsg'));

            if(res.ok && data.choices && data.choices.length > 0) {
                let reply = data.choices[0].message.content.trim();
                appendMessage(reply.replace(/\n/g, '<br>'), 'bot-msg');
            } else {
                let errorMsg = data.error ? data.error.message : "अनजान एरर";
                db.autoModel = "openai/gpt-oss-120b";
                appendMessage(`⚠️ API एरर: ${errorMsg}. मॉडल को 'openai/gpt-oss-120b' पर रीसेट कर दिया है, दोबारा भेजें।`, 'bot-msg');
            }
        } catch(e) {
            if(document.getElementById('loadingMsg')) chatBox.removeChild(document.getElementById('loadingMsg'));
            appendMessage("⚠️ कनेक्शन फेल हो गया। इंटरनेट या API Key की जांच करें।", 'bot-msg');
        }
    }
</script>

</body>
</html>
