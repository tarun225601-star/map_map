<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indian Business Hub | AI Co-Founder v6.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        html, body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: #060913; 
            color: #f1f5f9; 
            margin: 0; 
            padding: 0; 
            height: 100%;
            overflow: hidden;
        }
        .container { 
            width: 100%; 
            max-width: 480px; 
            height: 100%;
            background: #0f172a; 
            display: flex;
            flex-direction: column;
            margin: 0 auto;
            border-left: 1px solid #1e293b;
            border-right: 1px solid #1e293b;
        }
        .header {
            padding: 10px 14px;
            background: #0f172a;
            border-bottom: 1px solid #1e293b;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 50px;
            flex-shrink: 0;
        }
        h2 { color: #38bdf8; margin: 0; font-weight: 800; font-size: 14px; }
        .subtitle { font-size: 9px; color: #94a3b8; font-weight: 700; }
        
        .header-btns { display: flex; gap: 6px; align-items: center; }
        .token-badge {
            background: rgba(234, 179, 8, 0.15);
            border: 1px solid #eab308;
            color: #facc15;
            padding: 3px 6px;
            border-radius: 8px;
            font-size: 10px;
            font-weight: 800;
            cursor: pointer;
        }
        .action-btn { 
            background: #1e293b; 
            border: none; 
            font-size: 12px; 
            cursor: pointer; 
            color: #cbd5e1; 
            padding: 5px 7px;
            border-radius: 6px;
        }

        /* Main Workspace using Pure Flexbox (No absolute hiding) */
        .workspace {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #0b0f19;
            overflow: hidden;
            position: relative;
        }

        /* Top Business Selector Chips */
        .dashboard-section {
            padding: 8px 10px;
            border-bottom: 1px solid #1e293b;
            background: #0f172a;
            display: flex;
            gap: 6px;
            overflow-x: auto;
            flex-shrink: 0;
            white-space: nowrap;
        }
        .biz-chip {
            background: #111827;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 6px 10px;
            min-width: 120px;
            flex-shrink: 0;
            cursor: pointer;
            display: inline-block;
        }
        .biz-chip.active {
            border-color: #38bdf8;
            background: rgba(56, 189, 248, 0.15);
        }
        .biz-chip-name { font-size: 11px; font-weight: 800; color: #fff; }
        .biz-chip-cap { font-size: 9px; color: #38bdf8; font-weight: 700; margin-top: 2px; }

        /* Chat Messages Container */
        .chat-box { 
            flex: 1;
            overflow-y: auto; 
            padding: 12px;
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
        }
        .message { max-width: 88%; padding: 10px 12px; border-radius: 10px; font-size: 11px; font-weight: 700; line-height: 1.4; word-break: break-word; }
        .user-msg { background: #0284c7; color: #fff; align-self: flex-end; border-bottom-right-radius: 2px; }
        .bot-msg { background: #1f2937; color: #f1f5f9; align-self: flex-start; border-bottom-left-radius: 2px; border: 1px solid #374151; }

        /* Fixed Bottom Input Bar inside Flex */
        .chat-input-wrapper {
            background: #0f172a;
            border-top: 1px solid #1e293b;
            padding: 8px 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex-shrink: 0;
        }
        #imagePreviewContainer { display: none; align-items: center; gap: 8px; background: #1e293b; padding: 4px 8px; border-radius: 6px; width: fit-content; }
        #imagePreviewContainer img { width: 22px; height: 22px; object-fit: cover; border-radius: 4px; }
        #imagePreviewContainer span { font-size: 9px; color: #38bdf8; font-weight: 700; }
        .remove-img { background: none; border: none; color: #ef4444; font-weight: 800; cursor: pointer; font-size: 11px; }

        .chat-input-row {
            display: flex;
            align-items: center;
            background: #111827;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 4px 8px;
            gap: 6px;
        }
        .tool-icon-btn {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 15px;
            cursor: pointer;
            padding: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .tool-icon-btn.listening { color: #ef4444; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

        input[type="text"] { 
            flex: 1; 
            padding: 6px; 
            border: none; 
            background: transparent; 
            color: #fff; 
            font-size: 11px; 
            font-weight: 700; 
            outline: none;
        }
        .send-btn { 
            background: #0284c7; 
            border: none; 
            color: white; 
            width: 28px;
            height: 28px;
            border-radius: 50%; 
            font-weight: 800; 
            cursor: pointer; 
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            flex-shrink: 0;
        }

        /* Modal */
        .modal { 
            display: none; background: rgba(0,0,0,0.85); position: fixed; top:0; left:0; width:100%; height:100%; 
            padding: 15px; box-sizing: border-box; z-index: 100; overflow-y: auto; 
        }
        .modal-content { background: #111827; max-width: 380px; margin: 50px auto; padding: 16px; border-radius: 14px; border: 1px solid #374151; }
        .modal-content h3 { color: #38bdf8; margin-top: 0; font-weight: 800; font-size: 15px; }
        label { font-size: 11px; font-weight: 700; color: #94a3b8; display: block; margin-top: 8px; }
        .modal-btn { width: 100%; padding: 9px; margin-top: 12px; border-radius: 6px; border: none; background: #0284c7; color: #fff; font-weight: 800; cursor: pointer; font-size: 12px; }
        .close-btn { background: #374151; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div>
            <h2>🇮🇳 Indian Business Hub <span style="font-size:10px; color:#38bdf8;">v6.0</span></h2>
            <div class="subtitle">AI को-फाउंडर चैट सिस्टम</div>
        </div>
        <div class="header-btns">
            <div class="token-badge" onclick="addTokens()" title="टोकन जोड़ों">🪙 <span id="tokenCount">20</span> Tokens</div>
            <button class="action-btn" onclick="openSettings()" title="सेटिंग्स">⚙️</button>
        </div>
    </div>

    <div class="workspace">
        <!-- Top Horizontal Scrolling Business Bar -->
        <div class="dashboard-section" id="bizChipsContainer"></div>

        <!-- Chat Messages Box -->
        <div class="chat-box" id="chatBox"></div>
        
        <!-- Permanent Bottom Input Bar -->
        <div class="chat-input-wrapper">
            <div id="imagePreviewContainer">
                <img id="previewImg" src="" alt="preview">
                <span>फोटो जुड़ गई</span>
                <button class="remove-img" onclick="removeImage()">×</button>
            </div>
            <div class="chat-input-row">
                <button class="tool-icon-btn" onclick="document.getElementById('imageInput').click()" title="फोटो जोड़ें">📎</button>
                <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="handleImageUpload(event)">
                
                <button class="tool-icon-btn" id="micBtn" onclick="toggleSpeechRecognition()" title="बोलकर टाइप करें">🎙️</button>
                
                <input type="text" id="userInput" placeholder="भाई, धंधे की बात कर..." onkeypress="handleKeyPress(event)">
                
                <button class="send-btn" onclick="sendMessage()">➔</button>
            </div>
        </div>
    </div>
</div>

<!-- Settings Modal -->
<div id="settingsModal" class="modal">
    <div class="modal-content">
        <h3>⚙️ सेटिंग्स</h3>
        
        <label>Groq API Key:</label>
        <input type="password" id="grokKey" placeholder="अपनी API key यहाँ डालें...">

        <div id="modelStatus" style="font-size: 11px; color: #38bdf8; margin-top: 8px; font-weight: 700;"></div>

        <button class="modal-btn" onclick="saveSettings()">💾 सेव करें & मॉडल ऑटो-फेच करें</button>
        <button class="modal-btn close-btn" onclick="closeSettings()">बंद करें</button>
    </div>
</div>

<script>
    const APP_VERSION = "6.0_fixed_flex_chat";
    if(localStorage.getItem('ib_hub_version') !== APP_VERSION) {
        localStorage.clear();
        localStorage.setItem('ib_hub_version', APP_VERSION);
    }

    const categories = ['फूड & रिटेल', 'ऑटोमोटिव केयर', 'डीप क्लीनिंग', 'मोबाइल ऐप', 'ई-कॉमर्स', 'केमिकल्स & मैन्युफैक्चरिंग', 'एग्री-टेक', 'डिजिटल एजेंसी'];
    const bizTemplates = [
        {name: "फ्रूट स्टॉल एक्सप्रेस", cap: 11000, target: 10000000, cat: "फूड & रिटेल"},
        {name: "जेट Black पॉलिश", cap: 15000, target: 10000000, cat: "केमिकल्स"},
        {name: "Elight डीप क्लीनिंग", cap: 20000, target: 10000000, cat: "डीप क्लीनिंग"},
        {name: "CyberGuard Pro", cap: 10000, target: 10000000, cat: "मोबाइल ऐप"}
    ];

    let allBusinesses = [...bizTemplates];
    for(let i = 5; i <= 30; i++) {
        let cat = categories[i % categories.length];
        allBusinesses.push({
            name: `स्मार्ट वेंचर #${i}`,
            cap: 10000 + (i * 500),
            target: 10000000,
            cat: cat
        });
    }

    let db = JSON.parse(localStorage.getItem('indian_biz_hub_data')) || {
        grokKey: "",
        tokens: 20,
        activeBizIndex: 0,
        autoModel: "openai/gpt-oss-120b"
    };

    let attachedImageBase64 = null;

    window.onload = function() {
        document.getElementById('tokenCount').innerText = db.tokens;
        renderBizChips();
        let activeB = allBusinesses[db.activeBizIndex];
        appendMessage(`💪 राम-राम भाई! '${activeB.name}' (कैपिटल: ₹${activeB.cap.toLocaleString()}) सेट है। बता, आगे क्या प्लान है?`, 'bot-msg');
        
        if(db.grokKey) {
            fetchBestModel(db.grokKey);
        }
    };

    function renderBizChips() {
        let container = document.getElementById('bizChipsContainer');
        container.innerHTML = '';

        allBusinesses.forEach((b, idx) => {
            let isActive = db.activeBizIndex === idx;
            let chipHTML = `
                <div class="biz-chip ${isActive ? 'active' : ''}" onclick="switchActiveBiz(${idx})">
                    <div class="biz-chip-name">${idx + 1}. ${b.name}</div>
                    <div class="biz-chip-cap">₹${b.cap.toLocaleString()}</div>
                </div>
            `;
            container.innerHTML += chipHTML;
        });
    }

    function switchActiveBiz(idx) {
        db.activeBizIndex = idx;
        localStorage.setItem('indian_biz_hub_data', JSON.stringify(db));
        renderBizChips();

        let b = allBusinesses[idx];
        appendMessage(`⚡ बिजनेस बदलकर '${b.name}' कर दिया है। अब इसी पर बात होगी!`, 'bot-msg');
    }

    function addTokens() {
        db.tokens += 5;
        localStorage.setItem('indian_biz_hub_data', JSON.stringify(db));
        document.getElementById('tokenCount').innerText = db.tokens;
        alert("🎉 5 फ्री टोकन्स आपके वॉलेट में जुड़ गए!");
    }

    function handleImageUpload(event) {
        let file = event.target.files[0];
        if(!file) return;
        let reader = new FileReader();
        reader.onload = function(e) {
            attachedImageBase64 = e.target.result;
            document.getElementById('previewImg').src = attachedImageBase64;
            document.getElementById('imagePreviewContainer').style.display = 'flex';
        }
        reader.readAsDataURL(file);
    }

    function removeImage() {
        attachedImageBase64 = null;
        document.getElementById('imageInput').value = "";
        document.getElementById('imagePreviewContainer').style.display = 'none';
    }

    function toggleSpeechRecognition() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if(!SpeechRecognition) {
            alert("⚠️ ब्राउज़र वॉइस सपोर्ट नहीं करता।");
            return;
        }
        let recognition = new SpeechRecognition();
        recognition.lang = 'hi-IN';
        let micBtn = document.getElementById('micBtn');

        recognition.onstart = function() { micBtn.classList.add('listening'); };
        recognition.onresult = function(event) {
            document.getElementById('userInput').value = event.results[0][0].transcript;
            micBtn.classList.remove('listening');
        };
        recognition.onerror = function() { micBtn.classList.remove('listening'); };
        recognition.onend = function() { micBtn.classList.remove('listening'); };
        recognition.start();
    }

    function openSettings() {
        document.getElementById('grokKey').value = db.grokKey;
        document.getElementById('modelStatus').innerText = db.autoModel ? `एक्टिव मॉडल: ${db.autoModel}` : "मॉडल सेट हो रहा है...";
        document.getElementById('settingsModal').style.display = 'block';
    }
    
    function closeSettings() { document.getElementById('settingsModal').style.display = 'none'; }

    async function saveSettings() {
        let key = document.getElementById('grokKey').value.trim();
        if(!key) {
            alert("⚠️ कृपया अपनी Groq API Key दर्ज करें!");
            return;
        }
        db.grokKey = key;
        document.getElementById('modelStatus').innerText = "🔄 लेटेस्ट एक्टिव चैट मॉडल तलाश कर रहे हैं...";
        
        let success = await fetchBestModel(key);
        if(success) {
            localStorage.setItem('indian_biz_hub_data', JSON.stringify(db));
            alert("✅ API Key सेव हो गई!");
            closeSettings();
        } else {
            alert("❌ API Key गलत है।");
        }
    }

    async function fetchBestModel(apiKey) {
        try {
            let res = await fetch("https://api.groq.com/openai/v1/models", {
                method: "GET",
                headers: { "Authorization": `Bearer ${apiKey}` }
            });
            let data = await res.json();
            if(res.ok && data.data && data.data.length > 0) {
                let chatModels = data.data.filter(m => 
                    m.active !== false &&
                    (m.id.includes('gpt-oss') || m.id.includes('qwen') || m.id.includes('llama')) &&
                    !m.id.includes('guard') && !m.id.includes('embed')
                );
                if(chatModels.length > 0) {
                    let selected = chatModels.find(m => m.id.includes('gpt-oss-120b')) || chatModels[0];
                    db.autoModel = selected.id;
                } else {
                    db.autoModel = "openai/gpt-oss-120b";
                }
                localStorage.setItem('indian_biz_hub_data', JSON.stringify(db));
                return true;
            }
        } catch(e) { console.error(e); }
        if(!db.autoModel) db.autoModel = "openai/gpt-oss-120b";
        return true;
    }

    function handleKeyPress(e) { if(e.key === 'Enter') sendMessage(); }

    async function sendMessage() {
        let inputField = document.getElementById('userInput');
        let text = inputField.value.trim();
        if(!text && !attachedImageBase64) return;

        let displayHTML = text.replace(/\n/g, '<br>');
        if(attachedImageBase64) {
            displayHTML += `<br><img src="${attachedImageBase64}" style="max-width:100%; border-radius:6px; margin-top:6px;">`;
        }

        appendMessage(displayHTML, 'user-msg');
        
        let queryToSend = text;
        if(attachedImageBase64) queryToSend += " [उज़र ने स्क्रीनशॉट अटैच किया है]";

        inputField.value = "";
        removeImage();

        await triggerAIResponse(queryToSend);
    }

    function appendMessage(text, className) {
        let chatBox = document.getElementById('chatBox');
        let div = document.createElement('div');
        div.className = `message ${className}`;
        div.innerHTML = text;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function triggerAIResponse(query) {
        if(!db.grokKey) {
            appendMessage("⚠️ भाई, पहले ऊपर ⚙️ सेटिंग आइकन पर क्लिक करके अपनी Groq API Key डाल!", 'bot-msg');
            openSettings();
            return;
        }

        let b = allBusinesses[db.activeBizIndex];
        let chatBox = document.getElementById('chatBox');
        let loadingDiv = document.createElement('div');
        loadingDiv.className = 'message bot-msg';
        loadingDiv.id = 'loadingMsg';
        loadingDiv.innerText = "उस्ताद सोच रहा है...";
        chatBox.appendChild(loadingDiv);
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            let res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${db.grokKey}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    model: db.autoModel || "openai/gpt-oss-120b",
                    messages: [
                        { role: "system", content: `तू 'Indian Business Hub' ऐप का शार्प बिजनेस को-फाउंडर है। यूजर का एक्टिव बिजनेस है: '${b.name}', कैपिटल: ₹${b.cap} और टारगेट: ₹1 Crore. सिर्फ इसी बिजनेस पर फोकस कर। हमेशा 'हम' बोलकर हिंग्लिश में बात कर।` },
                        { role: "user", content: query }
                    ],
                    temperature: 0.7
                })
            });
            
            let data = await res.json();
            if(document.getElementById('loadingMsg')) chatBox.removeChild(document.getElementById('loadingMsg'));

            if(res.ok && data.choices && data.choices.length > 0) {
                let reply = data.choices[0].message.content.trim();
                appendMessage(reply.replace(/\n/g, '<br>'), 'bot-msg');
            } else {
                let errorMsg = data.error ? data.error.message : "अनजान एरर";
                appendMessage(`⚠️ API एरर: ${errorMsg}`, 'bot-msg');
            }
        } catch(e) {
            if(document.getElementById('loadingMsg')) chatBox.removeChild(document.getElementById('loadingMsg'));
            appendMessage("⚠️ कनेक्शन फेल हो गया।", 'bot-msg');
        }
    }
</script>

</body>
</html>
