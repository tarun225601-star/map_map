<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faridabad Live Map Fix</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            background-color: #121212;
            color: white;
            font-family: sans-serif;
            overflow: hidden;
        }
        #header {
            padding: 12px;
            background: #1f1f1f;
            display: flex;
            gap: 10px;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        #header input {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #444;
            background: #2a2a2a;
            color: white;
            font-size: 14px;
        }
        #header button {
            padding: 10px 18px;
            background: #00ffcc;
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        /* मैप बॉक्स की पक्की हाइट */
        #map-container {
            width: 100%;
            height: calc(100vh - 60px);
            background: #222;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div id="header">
        <input type="text" id="searchInput" value="Neelam Chowk, Faridabad">
        <button onclick="searchLocation()">लोकेशन ढूँढें 🚀</button>
    </div>

    <!-- मैप दिखाने के लिए अचूक iframe तरीका ताकि कभी ब्लैक स्क्रीन न आए -->
    <div id="map-container">
        <iframe id="mapFrame" 
            src="https://www.google.com/maps?q=Neelam+Chowk,Faridabad&output=embed">
        </iframe>
    </div>

    <script>
        function searchLocation() {
            var query = document.getElementById('searchInput').value;
            var iframe = document.getElementById('mapFrame');
            // सीधे गूगल मैप्स का एम्बेड यूआरएल अपडेट कर देगा, कोई ब्लैक स्क्रीन नहीं आएगी!
            iframe.src = "https://www.google.com/maps?q=" + encodeURIComponent(query + ", Faridabad") + "&output=embed";
        }
    </script>
</body>
</html>
