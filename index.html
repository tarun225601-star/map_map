<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Faridabad Game - Town Park Special</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; }
        #map { width: 100vw; height: 100vh; background: #111; }

        /* गेमिंग HUD */
        .game-hud {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(0, 0, 0, 0.85);
            padding: 10px 18px;
            border-radius: 30px;
            box-shadow: 0 0 20px rgba(0,255,255,0.4);
            display: flex;
            gap: 10px;
            border: 2px solid #00ffcc;
        }
        .game-hud input {
            padding: 8px 12px;
            width: 200px;
            background: #111;
            color: #fff;
            border: 1px solid #444;
            border-radius: 20px;
            outline: none;
            font-size: 14px;
        }
        .game-hud button {
            padding: 8px 16px;
            background: #00ffcc;
            color: #000;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }
        
        /* स्पीडोमीटर */
        .speedometer {
            position: absolute;
            bottom: 40px;
            right: 20px;
            background: rgba(0,0,0,0.85);
            color: #00ffcc;
            padding: 10px 18px;
            border-radius: 15px;
            border: 2px solid #00ffcc;
            font-weight: bold;
            font-size: 16px;
            z-index: 1000;
        }

        /* टाउन पार्क स्पेशल नेमप्लेट */
        .park-label {
            background: rgba(0, 128, 0, 0.9);
            color: white;
            padding: 5px 10px;
            border-radius: 10px;
            font-weight: bold;
            border: 2px solid #fff;
            box-shadow: 0 0 10px #00ff00;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="game-hud">
        <input type="text" id="destInput" placeholder="स्थान खोजें..." value="Town Park, Sector 12, Faridabad">
        <button onclick="startRide()">राइड शुरू 🏍️</button>
    </div>

    <div class="speedometer" id="speedText">स्पीड: 0 km/h</div>

    <div id="map"></div>

    <!-- Leaflet JS Library -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // 1. मैप सेटअप (फरीदाबाद, सेक्टर 12 - टाउन पार्क सेंटर)
        const map = L.map('map', { zoomControl: false }).setView([28.4089, 77.3178], 16);

        // डार्क गेमिंग थीम टायल्स (CartoDB Dark Matter - बिना किसी टोकन के फ्री)
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            maxZoom: 19,
            subdomains: 'abcd'
        }).addTo(map);

        let bikeMarker = null;

        // बाइक आइकॉन
        const bikeIcon = L.divIcon({
            html: '<div style="font-size: 30px; text-shadow: 0 0 10px rgba(0,255,255,0.8);">🏍️</div>',
            className: 'custom-bike-icon',
            iconSize: [30, 30]
        });

        // 🌳 टाउन पार्क, सेक्टर 12 का स्पेशल लैंडमार्क (Free Fire स्टाइल)
        const townParkCoords = [28.4120, 77.3210];
        const parkIcon = L.divIcon({
            html: '<div class="park-label">🌳 टाउन पार्क</div>',
            className: '',
            iconSize: [100, 40]
        });
        L.marker(townParkCoords, { icon: parkIcon }).addTo(map);

        // 2. लाइव GPS ट्रैकिंग
        function startLiveTracking() {
            if (navigator.geolocation) {
                navigator.geolocation.watchPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        const speed = position.coords.speed ? (position.coords.speed * 3.6).toFixed(0) : 0;

                        document.getElementById('speedText').innerHTML = `स्पीड: ${speed} km/h`;
                        const currentLatLng = [lat, lng];

                        if (!bikeMarker) {
                            bikeMarker = L.marker(currentLatLng, { icon: bikeIcon }).addTo(map);
                        } else {
                            bikeMarker.setLatLng(currentLatLng);
                        }

                        // कैमरा बाइक को फॉलो करेगा
                        map.setView(currentLatLng, 17, { animate: true });
                    },
                    (error) => { console.log("GPS Error: " + error.message); },
                    { enableHighAccuracy: true }
                );
            }
        }

        startLiveTracking();

        // 3. डेस्टिनेशन सर्च (Nominatim फ्री सर्च इंजन)
        function startRide() {
            const dest = document.getElementById('destInput').value;
            if(!dest) return;

            fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(dest + ', Faridabad')}`)
                .then(res => res.json())
                .then(data => {
                    if(data && data.length > 0) {
                        const destCoords = [parseFloat(data[0].lat), parseFloat(data[0].lon)];
                        L.marker(destCoords).addTo(map).bindPopup("<b>मंजिल:</b> " + dest).openPopup();
                        map.setView(destCoords, 17);
                        alert("मंजिल सेट हो गई है! चलिए बाइक लेकर 🏍️");
                    } else {
                        alert("जगह नहीं मिली!");
                    }
                });
        }
    </script>
</body>
</html>
