<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeOS Guardian | Real AI Business Co-Founder</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: #090d16; 
            color: #f1f5f9; 
            margin: 0; 
            padding: 16px; 
            display: flex;
            justify-content: center;
            height: 100vh;
        }
        .container { 
            width: 100%; 
            max-width: 480px; 
            background: #111827; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.6); 
            display: flex;
            flex-direction: column;
            border: 1px solid #1f2937;
            overflow: hidden;
            position: relative;
        }
        .header {
            padding: 16px 20px;
            background: #111827;
            border-bottom: 1px solid #1f2937;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        h2 { color: #38bdf8; margin: 0; font-weight: 800; font-size: 20px; }
        .subtitle { font-size: 11px; color: #94a3b8; font-weight: 700; }
        
        .gear-btn { 
            background: #1f2937; 
            border: none; 
            font-size: 18px; 
            cursor: pointer; 
            color: #cbd5e1; 
            padding: 8px 10px;
            border-radius: 10px;
            transition: 0.2s;
        }
        .gear-btn:hover { background: #374151; }

        /* चैट एरिया */
        .chat-container {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #0b0f19;
        }
        .message {
            max-width: 88%;
            padding: 14px 16px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 700;
            line-height: 1.5;
        }
        .user-msg {
            background: #0284c7;
            color: #fff;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .bot-msg {
            background: #1f2937;
            color: #f1f5f9;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            border: 1px solid #374151;
        }

        /* बोलकर सुनने वाला स्पीकर बटन */
        .speak-btn {
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid #38bdf8;
            color: #38bdf8;
            font-size: 12px;
            font-weight: 700;
            padding: 6px 10px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
        }
        .speak-btn:hover { background: rgba(56, 189, 248, 0.2); }

        /* चैट इनपुट बॉक्स */
        .chat-input-area {
            padding: 12px;
            background: #111827;
            border-top: 1px solid #1f2937;
            display: flex;
            gap: 8px;
        }
        input, select { 
            flex: 1; 
            padding: 12px; 
            border-radius: 10px; 
            border: 1px solid #4b5563; 
            background: #0b0f19; 
            color: #fff; 
            font-size: 14px; 
            font-weight: 700; 
            outline: none;
        }
        input:focus { border-color: #38bdf8; }
        .send-btn {
            background: #0284c7;
            border: none;
            color: white;
            padding: 0 16px;
            border-radius: 10px;
            font-weight: 800;
            cursor: pointer;
        }
        .send-btn:disabled { background: #374151; cursor: not-allowed; }

        /* सेटिंग्स मोडल */
        #settingsModal { 
            display: none; 
            background: rgba(0,0,0,0.85); 
            position: absolute; 
            top:0; left:0; width:100%; height:100%; 
            padding: 20px; 
            box-sizing: border-box; 
            z-index: 100;
            overflow-y: auto;
        }
        .modal-content { 
            background: #111827; 
            max-width: 400px; 
            margin: 20px auto; 
            padding: 20px; 
            border-radius: 16px; 
            border: 1px solid #374151; 
        }
        .modal-content h3 { color: #38bdf8; margin-top: 0; font-weight: 800; font-size: 16px; }
        label { font-size: 12px; font-weight: 700; color: #94a3b8; display: block; margin-top: 10px; }
        .modal-btn { width: 100%; padding: 10px; margin-top: 10px; border-radius: 8px; border: none; background: #0284c7; color: #fff; font-weight: 800; cursor: pointer; }
        .close-btn { background: #374151; }
        .success { color: #4ade80; font-size: 12px; font-weight: 700; margin-top: 5px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div>
            <h2>LifeOS Guardian</h2>
            <div class="subtitle">हमारा बिजनेस • हमारा बड़ा टारगेट</div>
        </div>
        <button class="gear-btn" onclick="openSettings()">⚙️</button>
    </div>

    <!-- चैट स्क्रीन -->
    <div class="chat-container" id="chatBox"></div>

    <!-- चैट इनपुट -->
    <div class="chat-input-area">
        <input type="text" id="userInput" placeholder="भाई, बता आज मार्केट में क्या सीन है..." onkeypress="handleKeyPress(event)">
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">भेजें</button>
    </div>
</div>

<!-- सेटिंग्स मोडल -->
<div id="settingsModal">
    <div class="modal-content">
        <h3>⚙️ बिजनेस और टारगेट सेटिंग्स</h3>
        
        <label>Groq API Key:</label>
        <input type="password" id="grokKey" placeholder="اپنی API key यहां डालें...">

        <label>हमारा बिजनेस नाम:</label>
        <input type="text" id="bizName" placeholder="जैसे: Fruit Stall">

        <label>हमारी कैपिटल (₹):</label>
        <input type="number" id="bizCapital" placeholder="11000">

        <label>हमारा बड़ा टारगेट (₹):</label>
        <input type="number" id="targetGoal" placeholder="10000000">

        <button class="modal-btn" onclick="saveAllSettings()">💾 सेव करें</button>
        <button class="modal-btn close-btn" onclick="closeSettings()">बंद करें</button>
        <div id="saveStatus" class="success"></div>
    </div>
</div>

<script>
    let db = JSON.parse(localStorage.getItem('lifeOS_data')) || {
        grokKey: "",
        bizName: "Fruit Stall",
        capital: 11000,
        goal: 10000000,
        transactions: []
    };

    window.onload = function() {
        if(!db.grokKey) {
            appendMessage("🔥 भाई, लाइव AI और टारगेट पर बात करने के लिए ऊपर ⚙️ (गेयर) बटन दबाकर अपनी **Groq API Key** डाल दे!", 'bot-msg');
        } else {
            appendMessage(`💪 राम-राम भाई! हमारा बिजनेस <strong>'${db.bizName}'</strong> चालू है और हमारा बड़ा टारगेट **₹${db.goal.toLocaleString()}** का है। बता, आज इसे हासिल करने के लिए क्या मैदान में उतरना है?`, 'bot-msg');
        }
    };

    function openSettings() {
        document.getElementById('grokKey').value = db.grokKey;
        document.getElementById('bizName').value = db.bizName;
        document.getElementById('bizCapital').value = db.capital;
        document.getElementById('targetGoal').value = db.goal;
        document.getElementById('settingsModal').style.display = 'block';
    }

    function closeSettings() {
        document.getElementById('settingsModal').style.display = 'none';
    }

    function saveAllSettings() {
        db.grokKey = document.getElementById('grokKey').value.trim();
        db.bizName = document.getElementById('bizName').value.trim() || "मेरा बिजनेस";
        db.capital = parseFloat(document.getElementById('bizCapital').value) || 100;
        db.goal = parseFloat(document.getElementById('targetGoal').value) || 10000000;

        localStorage.setItem('lifeOS_data', JSON.stringify(db));
        document.getElementById('saveStatus').innerText = "✅ टारगेट और सेटिंग्स अपडेट हो गई!";
        setTimeout(() => {
            document.getElementById('saveStatus').innerText = "";
            closeSettings();
        }, 1200);
    }

    function handleKeyPress(e) {
        if(e.key === 'Enter') sendMessage();
    }

    async function sendMessage() {
        let inputField = document.getElementById('userInput');
        let sendBtn = document.getElementById('sendBtn');
        let text = inputField.value.trim();
        if(!text) return;

        if(!db.grokKey) {
            alert("भाई, पहले ⚙️ सेटिंग में जाकर अपनी Groq API Key डाल!");
            openSettings();
            return;
        }

        appendMessage(text, 'user-msg');
        inputField.value = "";
        sendBtn.disabled = true;

        let chatBox = document.getElementById('chatBox');
        let loadingDiv = document.createElement('div');
        loadingDiv.className = 'message bot-msg';
        loadingDiv.innerText = "सोच रहा हूँ...";
        chatBox.appendChild(loadingDiv);
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            let aiReply = await fetchRealAIResponse(text);
            chatBox.removeChild(loadingDiv);
            appendMessageWithTypingEffect(aiReply, 'bot-msg');
        } catch (error) {
            chatBox.removeChild(loadingDiv);
            appendMessage("⚠️ भाई, API Key गलत है या इंटरनेट में दिक्कत है। सही की (Key) चेक कर.", 'bot-msg');
        } finally {
            sendBtn.disabled = false;
        }
    }

    function appendMessage(text, className) {
        let chatBox = document.getElementById('chatBox');
        let div = document.createElement('div');
        div.className = `message ${className}`;
        div.innerHTML = text;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    // टाइपराइटर इफ़ेक्ट और 'बोलकर सुनने वाला' बटन
    function appendMessageWithTypingEffect(htmlText, className) {
        let chatBox = document.getElementById('chatBox');
        let div = document.createElement('div');
        div.className = `message ${className}`;
        chatBox.appendChild(div);

        let i = 0;
        let speed = 10; 
        let rawTextForSpeech = htmlText.replace(/<[^>]*>?/gm, '');
        
        function typeWriter() {
            if (i < htmlText.length) {
                if (htmlText.charAt(i) === '<') {
                    let closeIdx = htmlText.indexOf('>', i);
                    if (closeIdx !== -1) {
                        div.innerHTML += htmlText.substring(i, closeIdx + 1);
                        i = closeIdx + 1;
                    } else {
                        div.innerHTML += htmlText.charAt(i);
                        i++;
                    }
                } else {
                    div.innerHTML += htmlText.charAt(i);
                    i++;
                }
                chatBox.scrollTop = chatBox.scrollHeight;
                setTimeout(typeWriter, speed);
            } else {
                let speakBtn = document.createElement('button');
                speakBtn.className = 'speak-btn';
                speakBtn.innerHTML = '🔊 बोलकर सुनें';
                speakBtn.onclick = () => speakText(rawTextForSpeech);
                div.appendChild(speakBtn);
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        }
        typeWriter();
    }

    function speakText(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            let utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'hi-IN';
            utterance.rate = 1.0;
            window.speechSynthesis.speak(utterance);
        } else {
            alert("भाई, इस डिवाइस में वॉइस सपोर्ट काम नहीं कर रहा।");
        }
    }

    // AI प्रॉम्प्ट जिसमें टारगेट हमेशा दिमाग में रहेगा
    async function fetchRealAIResponse(userQuery) {
        let systemPrompt = `तू एक खूंखार, शार्प और जमीनी बिजनेस को-फाउंडर (उस्ताद) है। 
        हमारा बिजनेस है: '${db.bizName}', हमारी कैपिटल है: ₹${db.capital} और हमारा सबसे बड़ा और मुख्य टारगेट है: ₹${db.goal} कमाना।
        
        महत्वपूर्ण नियम: 
        1. तू कभी भी कोई रटा-रटाया या डमी जवाब नहीं देगा। हर बार यूजर के सवाल के हिसाब से एकदम नया, प्रैक्टिकल और दमदार जवाब सोचकर देगा।
        2. तू हर जवाब में इस बात का खास ध्यान रखेगा और जिक्र करेगा कि हमें अपने ₹${db.goal} के टारगेट को कैसे भी करके हासिल करना है। 
        3. हमेशा 'हम', 'हमारा बिजनेस' और 'हमारा टारगेट' बोलकर बात कर, जैसे दो पक्के भाई मिलकर धंधा संभाल रहे हों।`;

        let response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
            method: "POST",
            headers: {
                "Authorization": `Bearer ${db.grokKey}`,
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                model: "llama-3.3-70b-versatile",
                messages: [
                    { role: "system", content: systemPrompt },
                    { role: "user", content: userQuery }
                ],
                temperature: 0.8
            })
        });

        let data = await response.json();
        if(data.choices && data.choices.length > 0) {
            return data.choices[0].message.content.replace(/\n/g, '<br>');
        } else {
            throw new Error("AI response failed");
        }
    }
</script>

</body>
</html>
