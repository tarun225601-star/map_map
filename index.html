<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Faridabad Satellite City GTA Style</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- OSM Buildings CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/osm-buildings@4.1.1/dist/osm-buildings.css" />

    <style>
        body { margin: 0; padding: 0; background: #000; font-family: sans-serif; overflow: hidden; }
        #map { width: 100vw; height: 100vh; }

        .search-box {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(0, 0, 0, 0.9);
            padding: 10px 18px;
            border-radius: 30px;
            border: 2px solid #00ffcc;
            display: flex;
            gap: 10px;
            box-shadow: 0 0 20px rgba(0,255,204,0.4);
        }
        .search-box input {
            background: #111;
            border: 1px solid #444;
            color: #fff;
            padding: 8px 14px;
            border-radius: 20px;
            outline: none;
            width: 200px;
        }
        .search-box button {
            background: #00ffcc;
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="search-box">
        <input type="text" id="destination" value="Town Park, Faridabad">
        <button onclick="findLocation()">3D उड़ान 🚁</button>
    </div>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- OSM Buildings JS -->
    <script src="https://cdn.jsdelivr.net/npm/osm-buildings@4.1.1/dist/osm-buildings.js"></script>

    <script>
        // 1. मैप सेटअप (टिल्ट एंगल और जूम के साथ ताकि 3D इफ़ेक्ट दिखे)
        const map = L.map('map', {
            zoomControl: false,
            maxZoom: 21,
            minZoom: 15
        }).setView([28.4120, 77.3210], 17);

        // 2. सैटेलाइट बेस लेयर
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19,
            attribution: 'Esri Satellite'
        }).addTo(map);

        // 3. OSM Buildings 3D लेयर (यह सैटेलाइट के ऊपर फरीदाबाद की बिल्डिंगों को 3D खड़ा कर देगी)
        var osmb = new OSMBuildings(map)
            .load('https://{s}.data.osmbuildings.org/0.2/anonymous/tile/{z}/{x}/{y}.json');

        // टाउन पार्क मार्कर
        L.marker([28.4120, 77.3210]).addTo(map)
            .bindPopup("<b>टाउन पार्क, सेक्टर 12 - 3D मोड</b>")
            .openPopup();

        function findLocation() {
            const query = document.getElementById('destination').value;
            if(!query) return;

            fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query + ', Faridabad')}`)
                .then(res => res.json())
                .then(data => {
                    if(data && data.length > 0) {
                        const lat = parseFloat(data[0].lat);
                        const lon = parseFloat(data[0].lon);
                        map.setView([lat, lon], 18, { animate: true });
                    } else {
                        alert("लोकेशन नहीं मिली!");
                    }
                });
        }
    </script>
</body>
</html>
