<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indian Business Hub | Desi Bro Agent v18.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        html, body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: #060913; 
            color: #f1f5f9; 
            margin: 0; 
            padding: 0; 
            height: 100%;
            overflow: hidden;
        }
        .container { 
            width: 100%; 
            max-width: 480px; 
            height: 100%;
            background: #0f172a; 
            display: flex;
            flex-direction: column;
            margin: 0 auto;
            border-left: 1px solid #1e293b;
            border-right: 1px solid #1e293b;
        }
        .header {
            padding: 10px 14px;
            background: #0f172a;
            border-bottom: 1px solid #1e293b;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 56px;
            flex-shrink: 0;
        }
        h2 { color: #38bdf8; margin: 0; font-weight: 800; font-size: 13px; }
        .subtitle { font-size: 9px; color: #10b981; font-weight: 800; }
        
        .header-btns { display: flex; gap: 6px; align-items: center; }
        .wallet-badge {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid #10b981;
            color: #34d399;
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 10px;
            font-weight: 800;
            cursor: pointer;
        }
        .action-btn { 
            background: #1e293b; 
            border: none; 
            font-size: 13px; 
            cursor: pointer; 
            color: #cbd5e1; 
            padding: 5px 8px;
            border-radius: 6px;
        }

        /* Progress Bar */
        .progress-container {
            background: #0b0f19;
            padding: 8px 14px;
            border-bottom: 1px solid #1e293b;
            font-size: 10px;
            font-weight: 700;
            flex-shrink: 0;
        }
        .progress-info { display: flex; justify-content: space-between; margin-bottom: 4px; color: #94a3b8; }
        .progress-info span b { color: #38bdf8; }
        .progress-bar-bg { width: 100%; background: #1e293b; height: 7px; border-radius: 4px; overflow: hidden; }
        .progress-bar-fill { width: 0%; background: linear-gradient(90deg, #10b981, #38bdf8); height: 100%; transition: width 0.3s; }

        /* Workspace */
        .workspace {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #0b0f19;
            overflow: hidden;
            position: relative;
        }

        /* Gift Package Card Dashboard Section */
        .dashboard-section {
            padding: 8px 12px;
            border-bottom: 1px solid #1e293b;
            background: #0f172a;
            flex-shrink: 0;
        }
        .gift-package-card {
            background: linear-gradient(135deg, #065f46 0%, #0f172a 100%);
            border: 1px solid #10b981;
            border-radius: 12px;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.15);
            position: relative;
            overflow: hidden;
        }
        .gift-package-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 4px; height: 100%;
            background: #10b981;
        }
        .gift-left { display: flex; align-items: center; gap: 8px; }
        .gift-icon { font-size: 20px; }
        .gift-title { font-size: 11px; font-weight: 800; color: #fff; max-width: 170px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .gift-sub { font-size: 9px; color: #34d399; font-weight: 700; margin-top: 2px; }
        .gift-goal-badge {
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid #34d399;
            color: #a7f3d0;
            padding: 5px 8px;
            border-radius: 8px;
            font-size: 10px;
            font-weight: 800;
            text-align: right;
        }

        /* Chat Messages Container */
        .chat-box { 
            flex: 1;
            overflow-y: auto; 
            padding: 14px;
            display: flex; 
            flex-direction: column; 
            gap: 14px; 
        }
        .message { 
            max-width: 92%; 
            padding: 12px 14px; 
            border-radius: 12px; 
            font-size: 13px; 
            font-weight: 700; 
            line-height: 1.6; 
            word-break: break-word; 
        }
        .user-msg { background: #0284c7; color: #fff; align-self: flex-end; border-bottom-right-radius: 2px; }
        .bot-msg { background: #1f2937; color: #f1f5f9; align-self: flex-start; border-bottom-left-radius: 2px; border: 1px solid #374151; }
        
        /* Yes/No Action Card inside Chat */
        .yesno-card {
            background: #111827;
            border: 1px solid #10b981;
            border-radius: 10px;
            padding: 10px;
            margin-top: 10px;
        }
        .yesno-title { font-size: 11px; color: #34d399; font-weight: 800; margin-bottom: 4px; }
        .yesno-desc { font-size: 12px; color: #cbd5e1; margin-bottom: 10px; font-weight: 700; }
        .yesno-buttons { display: flex; gap: 8px; }
        .yes-btn { background: #10b981; color: #fff; border: none; padding: 8px 14px; border-radius: 6px; font-size: 11px; font-weight: 800; cursor: pointer; flex: 1; text-align: center; }
        .no-btn { background: #ef4444; color: #fff; border: none; padding: 8px 14px; border-radius: 6px; font-size: 11px; font-weight: 800; cursor: pointer; flex: 1; text-align: center; }

        /* Fixed Bottom Input Bar */
        .chat-input-wrapper {
            background: #0f172a;
            border-top: 1px solid #1e293b;
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex-shrink: 0;
        }
        .chat-input-row {
            display: flex;
            align-items: center;
            background: #111827;
            border: 1px solid #334155;
            border-radius: 14px;
            padding: 6px 10px;
            gap: 8px;
        }
        input[type="text"] { 
            flex: 1; 
            padding: 6px; 
            border: none; 
            background: transparent; 
            color: #fff; 
            font-size: 13px; 
            font-weight: 700; 
            outline: none;
        }
        .send-btn { 
            background: #0284c7; 
            border: none; 
            color: white; 
            width: 32px;
            height: 32px;
            border-radius: 50%; 
            font-weight: 800; 
            cursor: pointer; 
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            flex-shrink: 0;
        }

        /* Modal */
        .modal { 
            display: none; background: rgba(0,0,0,0.85); position: fixed; top:0; left:0; width:100%; height:100%; 
            padding: 15px; box-sizing: border-box; z-index: 100; overflow-y: auto; 
        }
        .modal-content { background: #111827; max-width: 380px; margin: 30px auto; padding: 16px; border-radius: 14px; border: 1px solid #374151; }
        .modal-content h3 { color: #38bdf8; margin-top: 0; font-weight: 800; font-size: 14px; }
        label { font-size: 11px; font-weight: 700; color: #94a3b8; display: block; margin-top: 8px; }
        .modal-input, textarea.modal-input, select.modal-input { width:100%; padding: 7px; margin-top: 4px; background:#1e293b; border:1px solid #334155; color:#fff; border-radius:6px; font-size:11px; font-weight: 700; outline: none; font-family: 'Plus Jakarta Sans', sans-serif; }
        .modal-btn { width: 100%; padding: 9px; margin-top: 10px; border-radius: 6px; border: none; background: #0284c7; color: #fff; font-weight: 800; cursor: pointer; font-size: 11px; }
        .close-btn { background: #374151; margin-top: 6px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div>
            <h2>🪜 देसी ब्रो एजेंट <span style="font-size:9px; color:#10b981;">v18.0</span></h2>
            <div class="subtitle">🛡️ सुरक्षित बिजनेस रोडमैप</div>
        </div>
        <div class="header-btns">
            <div class="wallet-badge" onclick="openSettings()">💳 बजट: ₹<span id="walletBalance">0</span></div>
            <button class="action-btn" onclick="openSettings()">⚙️</button>
        </div>
    </div>

    <!-- Progress Tracker -->
    <div class="progress-container">
        <div class="progress-info">
            <span>कमाई का लक्ष्य (Target): <b id="packageGoalText">₹0</b></span>
            <span>सुरक्षित प्रगति: <b id="progressVal">₹0</b></span>
        </div>
        <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progressBar"></div>
        </div>
    </div>

    <div class="workspace">
        <!-- Gift Package Card Dashboard Section -->
        <div class="dashboard-section" id="giftSection" style="display:none;">
            <div class="gift-package-card" onclick="openSettings()">
                <div class="gift-left">
                    <div class="gift-icon">🪜</div>
                    <div>
                        <div class="gift-title" id="cardDesireText">बिजनेस इच्छा यहाँ दिखेगी</div>
                        <div class="gift-sub">सुरक्षित बजट: ₹<span id="cardBudgetText">0</span></div>
                    </div>
                </div>
                <div class="gift-goal-badge">
                    टारगेट लक्ष्य<br><span id="cardGoalText" style="color:#fff;">₹0</span>
                </div>
            </div>
        </div>

        <!-- Chat Box -->
        <div class="chat-box" id="chatBox"></div>
        
        <div class="chat-input-wrapper">
            <div class="chat-input-row">
                <input type="text" id="userInput" placeholder="यहाँ भाई से बात करें या नीचे बटन दबाएं..." onkeypress="handleKeyPress(event)">
                <button class="send-btn" onclick="sendMessage()">➔</button>
            </div>
        </div>
    </div>
</div>

<!-- Settings & Business Goal Modal -->
<div id="settingsModal" class="modal">
    <div class="modal-content">
        <h3>🛡️ सुरक्षित बिजनेस सेटअप और भाषा</h3>

        <label>🌐 भाषा चुनें (Select Language):</label>
        <select id="inputLang" class="modal-input">
            <option value="hindi">शुद्ध हिंदी (Pure Hindi)</option>
            <option value="hinglish">हिंग्लिश (Hinglish / Desi Bro)</option>
            <option value="english">English</option>
        </select>

        <label>💳 1. सुरक्षित बजट कितना है? (₹):</label>
        <input type="number" id="inputWallet" class="modal-input" placeholder="जैसे: 5000">

        <label>🎯 2. कमाई का लक्ष्य कितना है? (₹):</label>
        <input type="number" id="inputGoal" class="modal-input" placeholder="जैसे: 25000">

        <label>💡 3. कौन सा बिजनेस करना चाहते हैं? (विचार):</label>
        <textarea id="inputDesire" class="modal-input" rows="3" placeholder="जैसे: मुझे लोकल मार्केट में टिफिन सर्विस या डिजिटल डिजाइनिंग का काम शुरू करना है..."></textarea>

        <label>🔑 Groq API Key:</label>
        <input type="password" id="grokKey" class="modal-input" placeholder="अपनी API key यहाँ डालें...">
        
        <div id="modelStatus" style="font-size: 10px; color: #38bdf8; margin-top: 6px; font-weight: 700;"></div>

        <button class="modal-btn" onclick="saveSettings()">💾 सुरक्षित रोडमैप सहेजें</button>
        <button class="modal-btn close-btn" onclick="closeSettings()">बंद करें</button>
    </div>
</div>

<script>
    const APP_VERSION = "18.0_hindi_lang";
    
    let db = JSON.parse(localStorage.getItem('indian_biz_hub_v18')) || {
        grokKey: "",
        language: "hindi", // Default language
        packageData: null, 
        autoModel: "openai/gpt-oss-120b"
    };

    window.onload = function() {
        if(!db.packageData) {
            openSettings();
            appendMessage(`अरे भाई! <b>v18.0</b> तैयार है। अब भाषा चुनने का ऑप्शन भी मिल गया है!<br><br>ऊपर कोने में <b>⚙️ सेटिंग</b> पर क्लिक करके अपनी भाषा, बजट, लक्ष्य और बिजनेस का विचार भर दें। फिर देखें, आपका भाई आपको एकदम सुरक्षित और सही रास्ता दिखाएगा!`, 'bot-msg');
        } else {
            updateUIStats();
            let langWelcome = getLangWelcomeMessage(db.packageData.desire);
            appendMessage(langWelcome, 'bot-msg');
        }
        if(db.grokKey) fetchBestModel(db.grokKey);
    };

    function getLangWelcomeMessage(desire) {
        let lang = db.language || 'hindi';
        if(lang === 'english') {
            return `Hello brother! Your business plan <b>"${desire}"</b> is fully set. Tell me, what step should we take today?`;
        } else if(lang === 'hinglish') {
            return `राम-राम भाई! तेरा बिजनेस प्लान <b>"${desire}"</b> पूरी तरह सेट है। बता फिर, आज पहली सीढ़ी पर क्या एक्शन लिया जाए?`;
        } else {
            return `नमस्ते भाई! आपका व्यापार प्लान <b>"${desire}"</b> पूरी तरह तैयार है। बताइए, आज लक्ष्य की ओर कौन सा सुरक्षित कदम उठाया जाए?`;
        }
    }

    function updateUIStats() {
        if(!db.packageData) {
            document.getElementById('giftSection').style.display = 'none';
            return;
        }
        let p = db.packageData;
        document.getElementById('giftSection').style.display = 'block';
        document.getElementById('walletBalance').innerText = p.budget.toLocaleString();
        document.getElementById('packageGoalText').innerText = `₹${p.goal.toLocaleString()}`;
        document.getElementById('progressVal').innerText = '₹' + (p.current || 0).toLocaleString();
        
        document.getElementById('cardDesireText').innerText = p.desire;
        document.getElementById('cardBudgetText').innerText = p.budget.toLocaleString();
        document.getElementById('cardGoalText').innerText = '₹' + p.goal.toLocaleString();

        let percent = Math.min(100, Math.max(0, ((p.current || 0) / p.goal) * 100)).toFixed(1);
        document.getElementById('progressBar').style.width = percent + '%';
    }

    function openSettings() {
        let p = db.packageData || { budget: 5000, goal: 25000, desire: "" };
        document.getElementById('inputLang').value = db.language || 'hindi';
        document.getElementById('inputWallet').value = p.budget;
        document.getElementById('inputGoal').value = p.goal;
        document.getElementById('inputDesire').value = p.desire;
        document.getElementById('grokKey').value = db.grokKey;
        document.getElementById('modelStatus').innerText = db.autoModel ? `एक्टिव मॉडल: ${db.autoModel}` : "";
        document.getElementById('settingsModal').style.display = 'block';
    }

    function closeSettings() { 
        document.getElementById('settingsModal').style.display = 'none'; 
    }

    async function saveSettings() {
        let langVal = document.getElementById('inputLang').value;
        let walletVal = parseInt(document.getElementById('inputWallet').value) || 0;
        let goalVal = parseInt(document.getElementById('inputGoal').value) || 0;
        let desireVal = document.getElementById('inputDesire').value.trim() || "शानदार बिजनेस प्रोजेक्ट";
        let key = document.getElementById('grokKey').value.trim();

        if(goalVal <= 0) {
            alert("⚠️ कृपया कमाई का सही लक्ष्य (Target) दर्ज करें!");
            return;
        }

        db.language = langVal;
        let currentVal = db.packageData ? (db.packageData.current || 0) : 0;
        db.packageData = {
            budget: walletVal,
            goal: goalVal,
            desire: desireVal,
            current: currentVal
        };

        if(key) db.grokKey = key;

        saveData();
        updateUIStats();
        closeSettings();

        appendMessage(`बढ़िया भाई! सेटिंग सहेज ली गई है:<br>• भाषा: <b>${langVal.toUpperCase()}</b><br>• बिजनेस: <b>${desireVal}</b><br>• बजट: <b>₹${walletVal.toLocaleString()}</b><br>• लक्ष्य: <b>₹${goalVal.toLocaleString()}</b><br><br>चलो अब बिना ₹1 डुबोए, सीढ़ी-दर-सीढ़ी आगे बढ़ते हैं!`, 'bot-msg');

        if(key) {
            await fetchBestModel(key);
        }
    }

    function saveData() {
        localStorage.setItem('indian_biz_hub_v18', JSON.stringify(db));
    }

    async function fetchBestModel(apiKey) {
        try {
            let res = await fetch("https://api.groq.com/openai/v1/models", {
                headers: { "Authorization": `Bearer ${apiKey}` }
            });
            let data = await res.json();
            if(res.ok && data.data) {
                let models = data.data.filter(m => (m.id.includes('gpt-oss') || m.id.includes('llama')) && !m.id.includes('guard'));
                if(models.length > 0) db.autoModel = models[0].id;
                saveData();
                return true;
            }
        } catch(e) {}
        return false;
    }

    function handleKeyPress(e) { if(e.key === 'Enter') sendMessage(); }

    async function sendMessage() {
        let inputField = document.getElementById('userInput');
        let text = inputField.value.trim();
        if(!text) return;
        appendMessage(text, 'user-msg');
        inputField.value = "";
        await triggerAIResponse(text);
    }

    function appendMessage(text, className) {
        let chatBox = document.getElementById('chatBox');
        let div = document.createElement('div');
        div.className = `message ${className}`;
        div.innerHTML = text;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function triggerAIResponse(query) {
        if(!db.grokKey) {
            appendMessage("अरे भाई! पहले ऊपर ⚙️ सेटिंग में अपनी Groq API Key तो दर्ज करें!", 'bot-msg');
            openSettings();
            return;
        }

        if(!db.packageData) {
            appendMessage("भाई, पहले सेटिंग खोलकर अपना बिजनेस प्लान और बजट सेट करें!", 'bot-msg');
            openSettings();
            return;
        }

        let p = db.packageData;
        let currentLang = db.language || 'hindi';
        
        let systemPromptContent = "";
        if(currentLang === 'hindi') {
            systemPromptContent = `तू एक समझदार और मददगार बिजनेस कोच है। यूजर का बिजनेस: '${p.desire}', बजट: ₹${p.budget}, लक्ष्य: ₹${p.goal}, प्रगति: ₹${p.current || 0}. 
            भाषा पूरी तरह से **शुद्ध और स्पष्ट हिंदी** होनी चाहिए। कोई सट्टा या ट्रेडिंग नहीं। हमेशा 100% सुरक्षित, व्यावहारिक और शून्य-नुकसान वाला 'स्टेप-बाय-स्टेप' (सीढ़ी दर सीढ़ी) रास्ता बता। 
            छोटा सा सटीक सवाल पूछ जिसके नीचे हाँ/ना कार्ड आए।`;
        } else if(currentLang === 'hinglish') {
            systemPromptContent = `तू एक समझदार और देसी बिजनेस पार्टनर (Desi Bro Coach) है। यूजर का बिजनेस: '${p.desire}', बजट: ₹${p.budget}, गोल: ₹${p.goal}, प्रोग्रेस: ₹${p.current || 0}. भाषा हिंग्लिश और भाई जैसी होनी चाहिए। शून्य-नुकसान वाला 'स्टेप-बाय-स्टेप' रास्ता बता।`;
        } else {
            systemPromptContent = `You are a smart business coach. User's business: '${p.desire}', Budget: ₹${p.budget}, Goal: ₹${p.goal}, Progress: ₹${p.current || 0}. Respond in English with a 100% safe, zero-loss step-by-step roadmap.`;
        }

        let chatBox = document.getElementById('chatBox');
        let loadingDiv = document.createElement('div');
        loadingDiv.className = 'message bot-msg';
        loadingDiv.id = 'loadingMsg';
        loadingDiv.innerText = currentLang === 'english' ? "Thinking of the next safe step..." : "अगला सुरक्षित कदम सोचा जा रहा है...";
        chatBox.appendChild(loadingDiv);
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            let res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${db.grokKey}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    model: db.autoModel || "openai/gpt-oss-120b",
                    messages: [
                        { role: "system", content: systemPromptContent },
                        { role: "user", content: query }
                    ],
                    temperature: 0.75
                })
            });
            
            let data = await res.json();
            if(document.getElementById('loadingMsg')) chatBox.removeChild(document.getElementById('loadingMsg'));

            if(res.ok && data.choices) {
                let reply = data.choices[0].message.content.trim();
                reply = reply.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
                
                let finalHTML = reply.replace(/\n/g, '<br>');
                
                let yesText = currentLang === 'english' ? 'Yes, Step Done! ✅' : (currentLang === 'hinglish' ? 'हाँ, चढ़ गए सीढ़ी! ✅' : 'हाँ, सीढ़ी पूरी हुई! ✅');
                let noText = currentLang === 'english' ? 'No, Stop! ❌' : (currentLang === 'hinglish' ? 'ना, रोक भाई! ❌' : 'ना, रोकें! ❌');
                let cardTitle = currentLang === 'english' ? 'Safe Action Approval' : (currentLang === 'hinglish' ? 'भाई का सेफ अप्रूवल कार्ड' : 'सुरक्षित कदम स्वीकृति कार्ड');
                let cardDesc = currentLang === 'english' ? 'Should we proceed with this safe step?' : 'क्या इस सुरक्षित कदम को आगे बढ़ाएं?';

                finalHTML += `
                    <div class="yesno-card">
                        <div class="yesno-title">🛡️ ${cardTitle}</div>
                        <div class="yesno-desc">${cardDesc}</div>
                        <div class="yesno-buttons">
                            <button class="yes-btn" onclick="handleYesAction()">${yesText}</button>
                            <button class="no-btn" onclick="handleNoAction()">${noText}</button>
                        </div>
                    </div>
                `;

                appendMessage(finalHTML, 'bot-msg');
            } else {
                appendMessage(`⚠️ API में कुछ गड़बड़ हो गई: ${data.error ? data.error.message : "फेल"}`, 'bot-msg');
            }
        } catch(e) {
            if(document.getElementById('loadingMsg')) chatBox.removeChild(document.getElementById('loadingMsg'));
            appendMessage("⚠️ नेटवर्क में दिक्कत आ रही है भाई, जाँच करें.", 'bot-msg');
        }
    }

    function handleYesAction() {
        if(!db.packageData) return;
        let p = db.packageData;
        let increment = Math.round(p.goal * 0.15); 
        p.current = Math.min(p.goal, (p.current || 0) + increment);
        saveData();
        updateUIStats();
        
        let currentLang = db.language || 'hindi';
        let successMsg = "";
        if(currentLang === 'english') {
            successMsg = `Great job! Another step completed successfully! 🚀<br>Progress is now <b>₹${p.current.toLocaleString()} / ₹${p.goal.toLocaleString()}</b>. What's the next step?`;
        } else if(currentLang === 'hinglish') {
            successMsg = `बढ़िया भाई! एक और सीढ़ी पार कर ली तूने! 🚀<br>प्रोग्रेस बढ़कर <b>₹${p.current.toLocaleString()} / ₹${p.goal.toLocaleString()}</b> हो गई है। बता भाई, अब अगली सीढ़ी पर क्या करना है?`;
        } else {
            successMsg = `बहुत बढ़िया! आपने एक और सीढ़ी सफलतापूर्वक पार कर ली है! 🚀<br>प्रगति बढ़कर <b>₹${p.current.toLocaleString()} / ₹${p.goal.toLocaleString()}</b> हो गई है। बताइए, अब अगला सुरक्षित कदम क्या होगा?`;
        }
        appendMessage(successMsg, 'bot-msg');
    }

    function handleNoAction() {
        let currentLang = db.language || 'hindi';
        let cancelMsg = "";
        if(currentLang === 'english') {
            cancelMsg = `Alright, step halted! Safety first, no unnecessary risks. What should we change?`;
        } else if(currentLang === 'hinglish') {
            cancelMsg = `ठीक है भाई, स्टेप रोक दिया! बिना सोचे-समझे पैसा या रिस्क नहीं लेना है। बता, इसमें क्या चेंज करना है?`;
        } else {
            cancelMsg = `ठीक है, इस कदम को रोक दिया गया है! बिना सोचे-समझे कोई जोखिम नहीं लेना है। बताइए, इसमें क्या सुधार करना है?`;
        }
        appendMessage(cancelMsg, 'bot-msg');
    }
</script>

</body>
</html>
